<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERRITORY RPG セーブデータ完全調査</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:20px;line-height:1.6;background:#f6f6f6;color:#222}
main{max-width:1100px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
button{font-size:18px;padding:12px 20px;border:0;border-radius:8px;background:#222;color:white}
.notice{padding:12px;background:#fff4d6;border-radius:8px;margin:15px 0}
.summary{padding:12px;background:#eef7ee;border-radius:8px;margin:15px 0}
.empty{padding:15px;background:#ffe9e9;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #ccc;padding:7px;text-align:left;vertical-align:top}
code{word-break:break-all}
</style>
</head>
<body>
<main>
<h1>TERRITORY RPG セーブデータ完全調査</h1>
<div class="notice">
<b>重要：</b>このツールは「調査専用」です。<br>
セーブデータを削除・上書き・初期化しません。ゲーム本体のセーブ処理も実行しません。
</div>
<p>このページを<strong>ゲームと同じブラウザ環境・同じ保存元</strong>で開いてから、下のボタンを押してください。</p>
<button id="scan">セーブデータを調査する</button>
<section id="result"><p>まだ調査していません。</p></section>
</main>

<script>
(() => {
  const out = document.getElementById('result');

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  const fmtBytes = (n) => {
    if (n < 1024) return `${n} B`;
    if (n < 1024*1024) return `${(n/1024).toFixed(1)} KB`;
    return `${(n/1024/1024).toFixed(2)} MB`;
  };

  const inspectValue = (source, key, value) => {
    let parsed = null;
    let validJson = false;
    let summary = '';
    try {
      parsed = JSON.parse(value);
      validJson = !!parsed && typeof parsed === 'object';
      if (validJson) {
        const parts = [];
        if (parsed.name != null) parts.push(`名前=${parsed.name}`);
        if (parsed.level != null) parts.push(`Lv=${parsed.level}`);
        if (parsed.gold != null) parts.push(`G=${parsed.gold}`);
        if (parsed.exp != null) parts.push(`EXP=${parsed.exp}`);
        if (parsed.lastSave != null) parts.push(`lastSave=${parsed.lastSave}`);
        summary = parts.join(' / ') || 'JSONオブジェクト';
      }
    } catch (_) {}
    return {source, key, value, validJson, summary};
  };

  const run = () => {
    const rows = [];

    // IMPORTANT: read-only only. No setItem/removeItem/clear is called.
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        const lower = key.toLowerCase();
        if (
          lower.includes('territory_rpg') ||
          lower.includes('rpg_save') ||
          lower.includes('save_slot') ||
          lower.includes('save_backup')
        ) {
          const value = localStorage.getItem(key);
          if (value != null) rows.push(inspectValue('localStorage', key, value));
        }
      }
    } catch (e) {
      rows.push(inspectValue('error', 'localStorage', String(e)));
    }

    // Cookies are read-only here.
    try {
      const cookies = document.cookie ? document.cookie.split('; ') : [];
      for (const item of cookies) {
        const eq = item.indexOf('=');
        if (eq < 0) continue;
        const key = decodeURIComponent(item.slice(0, eq));
        const lower = key.toLowerCase();
        if (
          lower.includes('territory_rpg') ||
          lower.includes('rpg_save') ||
          lower.includes('save_slot') ||
          lower.includes('save_backup')
        ) {
          let value = '';
          try { value = decodeURIComponent(item.slice(eq + 1)); } catch (_) { value = item.slice(eq + 1); }
          rows.push(inspectValue('cookie', key, value));
        }
      }
    } catch (e) {
      rows.push(inspectValue('error', 'cookie', String(e)));
    }

    rows.sort((a,b) => `${a.source}:${a.key}`.localeCompare(`${b.source}:${b.key}`));

    const saveRows = rows.filter(r => r.source !== 'error');
    const valid = saveRows.filter(r => r.validJson);

    let html = '';
    html += `<div class="summary"><b>調査件数:</b> ${saveRows.length}　
      <b>JSONとして読めたもの:</b> ${valid.length}</div>`;

    if (!saveRows.length) {
      html += `<div class="empty">保存キーは見つかりませんでした。</div>`;
    } else {
      html += `<table><thead><tr>
        <th>保存場所</th><th>キー</th><th>サイズ</th><th>JSON</th><th>内容の概要</th>
      </tr></thead><tbody>`;
      for (const r of saveRows) {
        html += `<tr>
          <td>${esc(r.source)}</td>
          <td><code>${esc(r.key)}</code></td>
          <td>${fmtBytes(new Blob([r.value]).size)}</td>
          <td>${r.validJson ? '✓' : '—'}</td>
          <td>${esc(r.summary || 'JSONではない／概要なし')}</td>
        </tr>`;
      }
      html += `</tbody></table>`;

      html += `<h2>復元候補</h2>`;
      if (!valid.length) {
        html += `<p>JSON形式のセーブ候補は見つかりませんでした。</p>`;
      } else {
        html += `<ul>`;
        for (const r of valid) {
          html += `<li><code>${esc(r.key)}</code>（${esc(r.source)}） — ${esc(r.summary)}</li>`;
        }
        html += `</ul>`;
      }
    }

    html += `<h2>安全性</h2>
      <p>このページは調査中に <code>localStorage.removeItem</code>、
      <code>localStorage.clear</code>、Cookie削除、ゲームのセーブ処理を一切実行しません。
      読み取りだけを行います。</p>`;

    out.innerHTML = html;
  };

  document.getElementById('scan').addEventListener('click', run);
})();
</script>

</body>
</html>
