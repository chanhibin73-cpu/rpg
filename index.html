const getMapSpiral = (max) => {
    let x = 0, y = 0, dx = 0, dy = -1;
    const coords = [];
    for (let i = 0; i < max; i++) {
        if (-11 / 2 < x && x <= 11 / 2 && -11 / 2 < y && y <= 11 / 2)
            coords.push({ x, y });
        if (x === y || (x < 0 && x === -y) || (x > 0 && x === 1 - y)) {
            let temp = dx;
            dx = -dy;
            dy = temp;
        }
        x += dx;
        y += dy;
    }
    return coords;
};

const getRandomElements = (arr, n) => {
    let result = new Array(n), len = arr.length, taken = new Array(len);
    while (n--) {
        let x = Math.floor(Math.random() * len);
        result[n] = arr[x in taken ? taken[x] : x];
        taken[x] = --len in taken ? taken[len] : len;
    }
    return result;
};

const playSound = (type) => {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        if (type === 'attack') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
        else if (type === 'magic') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
        else if (type === 'damage') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }
    catch (e) { }
};

                gold: Math.floor((40 + enemyLevel * 15) * goldBonus * (baseName === RARE_ENEMY_STEEL_SLIME ? 8 : 1)),
                buffs: { atk: 0, def: 0, agi: 0, stun: 0 },
                skills: enemySkills,
                escaped: false,
                fleeAfterTurns: baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(5, 9) : null,
                fleeTurnCount: 0
            });
        }
        const nameCurrent = {};
        generatedEnemies.forEach(e => {
            if (nameCounts[e.baseName] > 1) {
                nameCurrent[e.baseName] = (nameCurrent[e.baseName] || 0) + 1;
                e.name = `${e.baseName}${String.fromCharCode(64 + nameCurrent[e.baseName])}`;
            }
            else {
                e.name = e.baseName;
            }
        });
        let allyHelp = null;
        if (isDefense) {
            const alliedNations = Object.values(player.nations).filter(n => n.relation === 'allied' && !n.isDestroyed);
            if (alliedNations.length > 0)
                allyHelp = alliedNations[randomInt(0, alliedNations.length - 1)];
        }
        const initialLogs = [];
        if (player.difficulty === 'hard')
            initialLogs.push(`【HARD MODE】敵が通常より強力だ...！`);
        if (player.difficulty === 'very_hard')
            initialLogs.push(`【VERY HARD MODE】敵が絶望的に強力だ...！`);
        if (isDefense) {
            initialLogs.push(`敵軍が領土に攻め込んできた！防衛せよ！`);
            if (player.infra?.fort)
                initialLogs.push(`防衛砦の効果発動！(全味方能力+20%)`);
            if (allyHelp)
                initialLogs.push(`同盟国【${allyHelp.name}】の援軍が駆けつけた！(全味方能力+25%)`);
        }
        else if (isInvasion) {
            initialLogs.push(`【${player.nations[targetNationId].name}】へ侵攻を開始！`);
            initialLogs.push(`凄まじい強さの敵兵が立ちはだかる…！(敵戦力5倍)`);
        }
        else if (direction === 'inside') {
            initialLogs.push(`自国領土内の安全なパトロールを開始！`);
            initialLogs.push(`敵が現れた！`);
        }
        else if (direction) {
            initialLogs.push(`【${dirData.name}】の方向へ探索を開始！`);
            initialLogs.push(`敵が現れた！`);
        }
        else {
            initialLogs.push(`敵が現れた！`);
        }
        setBattle({
            isDefense, isInvasion, targetNationId, direction, allyHelp,
            enemies: generatedEnemies, logs: initialLogs, isOver: false,
            selectedTargetId: generatedEnemies[0].id,
            playerBuffs: { atk: 0, def: 0, agi: 0, mAtk: 0, mDef: 0, mAtkMult: 1, evasion: 0.05, stun: 0, autoHealTurns: 0, autoHealPercent: 0, enemyDotTurns: 0, enemyDotMultiplier: 0.75, buffDurations: {} },
            turnCount: 0
        });
        setGameState('battle');
    };
    const processTurn = (actionType, skillData = null) => {
        if (!battle || battle.isOver)
            return;
        let newPlayer = { ...player };
        let newEnemies = battle.enemies.map(e => ({ ...e, buffs: { ...e.buffs } }));
        let logs = [...battle.logs];
        let stats = getStats(newPlayer);
        let battlePlayerBuffs = battle.playerBuffs ? { ...battle.playerBuffs } : { atk: 0, def: 0, agi: 0, mAtk: 0, mDef: 0, mAtkMult: 1, stun: 0, autoHealTurns: 0, autoHealPercent: 0, buffDurations: {} };
        let buffMultiplier = 1.0;
        if (battle.allyHelp)
            buffMultiplier += 0.25;
        if (battle.isDefense && newPlayer.infra?.fort)
            buffMultiplier += 0.20;
        stats.atk = Math.floor(stats.atk * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.atk))));
        stats.def = Math.floor(stats.def * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.def))));
        stats.mAtk = Math.floor(stats.mAtk * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.atk))) * (battlePlayerBuffs.mAtkMult || 1) * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.mAtk || 0))));
        stats.mDef = Math.floor(stats.mDef * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.def))) * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.mDef || 0))));
        stats.agi = Math.floor(stats.agi * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.agi))));
        const addLog = (msg) => logs.push(msg);
        let targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
        const actors = [
            { isPlayer: true, agi: stats.agi },
            ...newEnemies.filter(e => e.hp > 0).map(e => {
                let eAgi = Math.floor(e.agi * (1 + Math.max(-0.5, Math.min(1.0, e.buffs.agi))));
                return { isPlayer: false, id: e.id, agi: eAgi };
            })
        ].sort((a, b) => b.agi - a.agi);
        // ダメージ計算：{(攻撃力×バフ・デバフ補正) - (防御力×バフ・デバフ補正÷2)}×技倍率
        const calculateDamage = (atkVal, defVal, lukVal, multiplier = 1, atkBuff = 0, defBuff = 0, targetBaseName = null, element = null) => {
            const safeLuk = lukVal || 10;
            const critChance = Math.min(50, safeLuk * 1.5);
            const isCrit = randomInt(1, 100) <= critChance;
            const safeAtkBuff = Math.max(-0.5, Math.min(1.0, atkBuff || 0));
            const safeDefBuff = Math.max(-0.5, Math.min(1.0, defBuff || 0));
            const effectiveAtk = atkVal * (1 + safeAtkBuff);
            const effectiveDef = defVal * (1 + safeDefBuff);
            let dmg = Math.max(1, Math.floor((effectiveAtk * effectiveAtk / (effectiveAtk + effectiveDef)) * multiplier));
            if (isCrit)
                dmg = Math.floor(dmg * 2);
            if (targetBaseName === RARE_ENEMY_STEEL_SLIME)
                dmg = randomInt(1, 2);
            if ((targetBaseName === RARE_ENEMY_YETI && element === '火') || (targetBaseName === MID_BOSS_FIRE_GOLEM_NAME && element === '水'))
                dmg = Math.floor(dmg * 3);
            return { dmg, isCrit };
        };
        let fled = false;
        for (let actor of actors) {
            if (newPlayer.hp <= 0)
                break;
            if (newEnemies.every(e => e.hp <= 0))
                break;
            if (actor.isPlayer) {
                if (battlePlayerBuffs.stun > 0) {
                    battlePlayerBuffs.stun -= 1;
                    addLog(`あなたは行動不能だ！`);
                    continue;
                }
                if (actionType === 'flee') {
                    if (battle.isDefense) {
                        addLog('防衛戦からは逃げられない！領土を見捨てることになる！');
                        fled = true;
                        break;
                    }
                    else {
                        const avgAgi = newEnemies.reduce((sum, e) => sum + e.agi, 0) / newEnemies.length;
                        if (randomInt(1, 100) <= 50 + stats.agi - avgAgi) {
                            addLog('逃げ出すことに成功した！');
                            fled = true;
                            break;
                        }
                        else {
                            addLog('逃げられなかった！');
                        }
                    }
                }
                else if (actionType === 'attack') {
                    if (newPlayer.job === 'mage') {
                        addLog(`魔道士は物理攻撃ができない！`);
                    }
                    else {
                        playSound('attack');
                        triggerShake();
                        targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                        if (!targetEnemy)
                            continue;
                        const { dmg, isCrit } = calculateDamage(stats.atk, targetEnemy.def, stats.luk, 1, 0, targetEnemy.buffs.def, targetEnemy.baseName);
                        targetEnemy.hp -= dmg;
                        addLog(`あなたの攻撃！ ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                        if (newPlayer.equipment?.weapon?.id === 'w_fire_sword' && randomInt(1, 100) <= 30 && targetEnemy.hp > 0) {
                            targetEnemy.burnTurns = randomInt(3, 5);
                            addLog(`【ファイアソード】${targetEnemy.name}にやけどを付与した！(${targetEnemy.burnTurns}ターン)`);
                        }
                    }
                }
                else if (actionType === 'skill' && skillData) {
                    let actMpCost = skillData.mpCost || 0;
                    // 魔法攻撃は倍率に応じてMP消費を算出（1倍につき4MP・切り捨て）
                    if (skillData.type === 'magic' && typeof skillData.multiplier === 'number' && !skillData.fixedMp) {
                        actMpCost = Math.floor(skillData.multiplier * 4);
                    }
                    // 魔道士は消費MP半減（切り捨て・最低1MP）
                    if (newPlayer.job === 'mage' && actMpCost > 0)
                        actMpCost = Math.max(1, Math.floor(actMpCost / 2));
                    if (newPlayer.mp < actMpCost) {
                        addLog(`MPが足りない！`);
                    }
                    else {
                        newPlayer.mp -= actMpCost;
                        playSound('magic');
                        triggerShake();
                        if (skillData.type === 'stun') {
                            targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                            if (!targetEnemy)
                                continue;
                            let stunTurns = 1;
                            if (randomInt(1, 3) === 1)
                                stunTurns = 2;
                            targetEnemy.buffs.stun = (targetEnemy.buffs.stun || 0) + stunTurns;
                            addLog(`【${skillData.name}】${targetEnemy.name}の時を止めた！(${stunTurns}ターン)`);
                        }
                        else if (skillData.type === 'buff_dynamic') {
                            let baseVal = 0.2;
                            let bonus = Math.floor(newPlayer.level / 5) * 0.05;
                            battlePlayerBuffs[skillData.stat] += (baseVal + bonus);
                            addLog(`【${skillData.name}】あなたの${STAT_NAMES[skillData.stat]}が大幅に上昇した！`);
                        }
                        else if (skillData.type === 'buff') {
                            battlePlayerBuffs[skillData.stat] += skillData.val;
                            if (skillData.duration)
                                battlePlayerBuffs.buffDurations[skillData.stat] = skillData.duration;
                            addLog(`【${skillData.name}】あなたの${STAT_NAMES[skillData.stat]}が変化した！`);
                        }
                        else if (skillData.type === 'debuff') {
                            targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                            if (!targetEnemy)
                                continue;
                            targetEnemy.buffs[skillData.stat] += skillData.val;
                            if (skillData.duration) {
                                targetEnemy.buffs.durations = targetEnemy.buffs.durations || {};
                                targetEnemy.buffs.durations[skillData.stat] = skillData.duration;
                            }
                            addLog(`【${skillData.name}】${targetEnemy.name}の${STAT_NAMES[skillData.stat]}が低下した！`);
                        }
                        else if (skillData.type === 'heal' || skillData.type === 'heal_full' || skillData.type === 'perfect_heal') {
                            const healAmount = skillData.type === 'heal_full' || skillData.type === 'perfect_heal' ? stats.maxHp : Math.max(1, Math.floor(stats.maxHp * ((skillData.healPercent || 0) / 100)));
                            newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + healAmount);
                            addLog(`${skillData.name}！ HPが${healAmount >= stats.maxHp ? '全回復' : healAmount + '回復'}した！`);
                            if (skillData.target === 'all')
                                addLog('味方全体を回復した！');
                            if (skillData.type === 'perfect_heal') {
                                battlePlayerBuffs.autoHealTurns = 5;
                                battlePlayerBuffs.autoHealPercent = 20;
                            }
                        }
                        else if (skillData.type === 'auto_heal') {
                            battlePlayerBuffs.autoHealTurns = skillData.turns || 5;
                            battlePlayerBuffs.autoHealPercent = skillData.healPercent || 10;
                            addLog(`${skillData.name}！ 5ターンの自動回復を開始した！`);
                        }
                        else if (skillData.type === 'magic_boost' || skillData.type === 'phoenix' || skillData.type === 'magic_buff' || skillData.type === 'magic_buff_debuff' || skillData.type === 'magic_debuff' || skillData.type === 'magic_status' || skillData.type === 'magic_selfstun' || skillData.type === 'magic_multi' || skillData.type === 'magic') {
                            addLog(`${skillData.name}！`);
                            const applyEnemyDebuff = (e, deb) => {
                                if (!e || e.hp <= 0 || !deb)
                                    return;
                                e.buffs[deb.stat] = (e.buffs[deb.stat] || 0) + deb.val;
                                e.buffs.durations = e.buffs.durations || {};
                                e.buffs.durations[deb.stat] = deb.turns || 5;
                            };
                            const hitEnemy = (e, mult, allowCrit = true) => {
                                if (!e || e.hp <= 0 || !mult)
                                    return;
                                const { dmg, isCrit } = calculateDamage(stats.mAtk, e.mDef, stats.luk, mult, battlePlayerBuffs.mAtk || 0, e.buffs.def, e.baseName, skillData.element);
                                e.hp -= dmg;
                                addLog(` -> ${e.name}に${dmg}ダメージ！${isCrit && allowCrit ? '(会心!)' : ''}`);
                                return { dmg, isCrit };
                            };
                            const alive = () => newEnemies.filter(e => e.hp > 0);
                            if (skillData.type === 'magic_boost') {
                                battlePlayerBuffs.mAtkMult = (battlePlayerBuffs.mAtkMult || 1) * 1.5;
                                battlePlayerBuffs.buffDurations.mAtkMult = 5;
                                const selfDmg = Math.max(1, Math.floor(stats.maxHp * 0.3));
                                newPlayer.hp -= selfDmg;
                                addLog(`自分の魔攻が50%上昇！30%の自傷ダメージ（${selfDmg}）`);
                            }
                            else if (skillData.type === 'phoenix') {
                                battlePlayerBuffs.autoHealTurns = 5;
                                battlePlayerBuffs.autoHealPercent = 10;
                                battlePlayerBuffs.phoenixTurns = 5;
                                battlePlayerBuffs.phoenixDotMultiplier = 0.75;
                                addLog('自分に5ターンの再生効果、敵に5ターンの継続ダメージ効果！');
                            }
                            else {
                                const targets = skillData.target === 'all' ? Array.from(alive()) : [];
                                if (skillData.target === 'random') {
                                    for (let i = 0; i < (skillData.hits || 1); i++) {
                                        const list = alive();
                                        if (!list.length)
                                            break;
                                        const e = list[randomInt(0, list.length - 1)];
                                        hitEnemy(e, skillData.multiplier);
                                        if (skillData.stunChance && randomInt(1, 100) <= skillData.stunChance) {
                                            e.buffs.stun = (e.buffs.stun || 0) + (skillData.stunTurns || 1);
                                            addLog(` -> ${e.name}は行動不能になった！`);
                                        }
                                    }
                                }
                                else if (skillData.target === 'all') {
                                    Array.from(targets).forEach(e => { hitEnemy(e, skillData.multiplier); if (skillData.stunChance && randomInt(1, 100) <= skillData.stunChance) {
                                        e.buffs.stun = (e.buffs.stun || 0) + (skillData.stunTurns || 1);
                                        addLog(` -> ${e.name}は行動不能になった！`);
                                    } });
                                }
                                else if (skillData.target === 'single') {
                                    targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || alive()[0];
                                    if (targetEnemy) {
                                        for (let i = 0; i < (skillData.hits || 1); i++) {
                                            if (targetEnemy.hp <= 0)
                                                break;
                                            hitEnemy(targetEnemy, skillData.multiplier);
                                        }
                                        if (skillData.stunChance && randomInt(1, 100) <= skillData.stunChance) {
                                            targetEnemy.buffs.stun = (targetEnemy.buffs.stun || 0) + (skillData.stunTurns || 1);
                                        }
                                    }
                                }
                                if (skillData.enemyDebuff)
                                    alive().forEach(e => applyEnemyDebuff(e, skillData.enemyDebuff));
                                if (skillData.enemyDebuffAll)
                                    alive().forEach(e => Object.entries(skillData.enemyDebuffAll).filter(([k]) => k !== 'turns').forEach(([stat, val]) => applyEnemyDebuff(e, { stat, val, turns: skillData.enemyDebuffAll.turns })));
                                if (skillData.enemyDotMultiplier) {
                                    battlePlayerBuffs.enemyDotTurns = skillData.enemyDotTurns || 5;
                                    battlePlayerBuffs.enemyDotMultiplier = skillData.enemyDotMultiplier;
                                    addLog(`敵全体に毎ターン×${skillData.enemyDotMultiplier}の継続ダメージ（${battlePlayerBuffs.enemyDotTurns}ターン）！`);
                                }
                                if (skillData.selfBuffs)
                                    skillData.selfBuffs.forEach(b => { if (b.stat === 'mAtkMult')
                                        battlePlayerBuffs.mAtkMult = (battlePlayerBuffs.mAtkMult || 1) * (1 + b.val);
                                    else
                                        battlePlayerBuffs[b.stat] = (battlePlayerBuffs[b.stat] || 0) + b.val; battlePlayerBuffs.buffDurations[b.stat] = b.turns || 5; });
                                if (skillData.selfStunTurns)
                                    battlePlayerBuffs.stun = (battlePlayerBuffs.stun || 0) + skillData.selfStunTurns;
                            }
                            if (newPlayer.equipment?.weapon?.id === 'w_fire_sword' && ['attack', 'attack_multi'].includes(skillData.type)) {
                                const burnTargets = skillData.target === 'all' ? newEnemies.filter(e => e.hp > 0) : [targetEnemy].filter(Boolean);
                                burnTargets.forEach(e => {
                                    if (e.hp > 0 && randomInt(1, 100) <= 30) {
                                        e.burnTurns = randomInt(3, 5);
                                        addLog(`【ファイアソード】${e.name}にやけどを付与した！(${e.burnTurns}ターン)`);
                                    }
                                });
                            }
                            if (skillData.selfDamagePercent) {
                                const selfDmg = Math.max(1, Math.floor(stats.maxHp * skillData.selfDamagePercent / 100));
                                newPlayer.hp -= selfDmg;
                            }
                        }
                        else {
                            targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                            if (!targetEnemy)
                                continue;
                            const isMagic = skillData.type === 'magic';
                            let tDef = isMagic ? targetEnemy.mDef : targetEnemy.def;
                            let myAtk = isMagic ? stats.mAtk : stats.atk;
                            if (skillData.type === 'attack_multi') {
                                addLog(`${skillData.name}！`);
                                for (let i = 0; i < (skillData.hits || 1); i++) {
                                    if (targetEnemy.hp <= 0)
                                        break;
                                    const { dmg, isCrit } = calculateDamage(myAtk, tDef, stats.luk, skillData.multiplier, 0, targetEnemy.buffs.def, targetEnemy.baseName, skillData.element);
                                    targetEnemy.hp -= dmg;
                                    addLog(` -> ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                                }
                            }
                            else if (skillData.target === 'all') {
                                addLog(`${skillData.name}！`);
                                newEnemies.filter(e => e.hp > 0).forEach(e => {
                                    const { dmg, isCrit } = calculateDamage(myAtk, e.def, stats.luk, skillData.multiplier, 0, e.buffs.def, e.baseName, skillData.element);
                                    e.hp -= dmg;
                                    addLog(` -> ${e.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                                });
                            }
                            else {
                                const { dmg, isCrit } = calculateDamage(myAtk, tDef, stats.luk, skillData.multiplier, 0, targetEnemy.buffs.def, targetEnemy.baseName, skillData.element);
                                targetEnemy.hp -= dmg;
                                addLog(`${skillData.name}！ ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                            }
                        }
                    }
                }
            }
            else {
                const enemy = newEnemies.find(e => e.id === actor.id);
                if (enemy && enemy.hp > 0) {
                    if (enemy.buffs.stun && enemy.buffs.stun > 0) {
                        enemy.buffs.stun -= 1;
                        addLog(`${enemy.name}は時を止められている！行動不能！`);
                        continue;
                    }
                    const enemyLuk = Math.min(20, enemy.level * 2);
                    let eAtk = Math.floor(enemy.atk * (1 + Math.max(-0.5, Math.min(1.0, enemy.buffs.atk))));
                    let eMAtk = Math.floor(enemy.mAtk || enemy.atk);
                    let eDef = Math.floor(enemy.def * (1 + Math.max(-0.5, Math.min(1.0, enemy.buffs.def))));
                    const playerEvasion = Math.max(0, Math.min(1, (battlePlayerBuffs.evasion || 0) + (enemy.baseName === BOSS_HG_NAME ? (enemy.hgEvasion || 0) : 0)));
                    const evasionRoll = () => Math.random() < playerEvasion;
                    let usedSkill = null;
                    if (enemy.baseName === BOSS_HG_NAME) {
                        const hgTurn = (battle.turnCount || 0) + 1;
                        if (hgTurn === 1 || enemy.hgNextSwingTurn === hgTurn) usedSkill = SKILLS_DATA.hg_swing;
                        else if (Math.random() < 0.15) usedSkill = SKILLS_DATA.hg_fireball;
                        else if (Math.random() < 0.15) usedSkill = SKILLS_DATA.hg_drain_kiss;
                    }
                    else if (enemy.baseName === RARE_ENEMY_YETI) {
                        const yetiTurn = (battle.turnCount || 0) + 1;
                        if (yetiTurn === 1 || enemy.yetiNextDebuffTurn === yetiTurn)
                            usedSkill = SKILLS_DATA.yeti_debuff_all;
                    }
                    else if (enemy.baseName === 'メデューサ' && Math.random() < 0.10) usedSkill = SKILLS_DATA.gorgon_eye;
                    else if (enemy.baseName === 'ウィッチ' && Math.random() < 0.75) usedSkill = SKILLS_DATA[enemy.buffs.mAtk && enemy.buffs.mAtk > 0.5 ? 'fireball' : (Math.random() < 0.25 ? 'magic_booster' : 'fireball')];
                    else if (enemy.baseName === 'ペスト' && Math.random() < 0.75) usedSkill = SKILLS_DATA[['buff_atk', 'buff_def', 'heal_light'][randomInt(0, 2)]];
                    else if (enemy.baseName === 'ハーピィ' && Math.random() < 0.80) usedSkill = SKILLS_DATA[Math.random() < 0.5 ? 'wind_cutter' : 'air_slash'];
                    else if (enemy.baseName === 'マッドマン' && Math.random() < 0.75) usedSkill = SKILLS_DATA[Math.random() < 0.6 ? 'earth_spike' : 'heal_light'];
                    else if (enemy.skills && enemy.skills.length > 0 && randomInt(1, 100) <= 25) {
                        const randomSkillId = enemy.skills[randomInt(0, enemy.skills.length - 1)];
                        usedSkill = SKILLS_DATA[randomSkillId];
                    }
                    if (usedSkill) {
                        playSound('magic');
                        triggerShake();
                        let eMult = usedSkill.multiplier || 1;
                        if (usedSkill.type === 'hg_buff') {
                            enemy.buffs.atk = (enemy.buffs.atk || 0) + 0.5;
                            enemy.buffs.agi = (enemy.buffs.agi || 0) + 0.5;
                            enemy.hgEvasion = 0.10;
                            enemy.hgBuffTurns = 5;
                            enemy.hgNextSwingTurn = null;
                            addLog(`${enemy.name}の素振り！ 攻撃力・速度が50%上昇し、回避率が10%上昇した！`);
                            continue;
                        }
                        else if (usedSkill.type === 'hg_percent_damage') {
                            if (evasionRoll()) { addLog(`${enemy.name}のファイアボール！ しかし回避した！`); continue; }
                            const dmg = Math.max(1, Math.floor(stats.maxHp * 0.20));
                            newPlayer.hp -= dmg;
                            addLog(`${enemy.name}のファイアボール！ 防御を無視して${dmg}ダメージ！`);
                            continue;
                        }
                        else if (usedSkill.type === 'hg_drain') {
                            if (evasionRoll()) { addLog(`${enemy.name}のドレインキッッッス！ しかし回避した！`); continue; }
                            const { dmg, isCrit } = calculateDamage(eAtk, stats.def, enemyLuk, 0.8, enemy.buffs.atk, battlePlayerBuffs.def);
                            newPlayer.hp -= dmg;
                            enemy.hp = Math.min(enemy.maxHp, enemy.hp + Math.floor(dmg / 3));
                            addLog(`${enemy.name}のドレインキッッッス！ あなたは${dmg}ダメージ！ ${Math.floor(dmg / 3)}回復した！${isCrit ? '(痛恨!)' : ''}`);
                            continue;
                        }
                        if (usedSkill.type === 'magic')
                            eMult *= 0.2;
                        if (usedSkill.type === 'attack' || usedSkill.type === 'magic') {
                            const isMagic = usedSkill.type === 'magic';
                            let defToUse = isMagic ? stats.mDef : stats.def;
                            let atkToUse = isMagic ? eMAtk : eAtk;
                            if (usedSkill.target === 'all') {
                                if (evasionRoll()) { addLog(`${enemy.name}の${usedSkill.name}！ しかし回避した！`); continue; }
                                const { dmg, isCrit } = calculateDamage(atkToUse, defToUse, enemyLuk, eMult, enemy.buffs.atk, battlePlayerBuffs.def);
                                newPlayer.hp -= dmg;
                                addLog(`${enemy.name}の${usedSkill.name}！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
                            }
                            else {
                                const { dmg, isCrit } = calculateDamage(atkToUse, defToUse, enemyLuk, eMult, enemy.buffs.atk, battlePlayerBuffs.def);
                                newPlayer.hp -= dmg;
                                addLog(`${enemy.name}の${usedSkill.name}！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
                            }
                        }
                        else if (usedSkill.type === 'attack_multi') {
                            addLog(`${enemy.name}の${usedSkill.name}！`);
                            for (let i = 0; i < (usedSkill.hits || 1); i++) {
                                if (newPlayer.hp <= 0)
                                    break;
                                if (evasionRoll()) { addLog(` -> 回避した！`); continue; }
                                const { dmg, isCrit } = calculateDamage(eAtk, stats.def, enemyLuk, usedSkill.multiplier, enemy.buffs.atk, battlePlayerBuffs.def);
                                newPlayer.hp -= dmg;
                                addLog(` -> あなたに${dmg}ダメージ！${isCrit ? '(痛恨!)' : ''}`);
                            }
                        }
                        else if (usedSkill.type === 'heal') {
                            const enemyHealAmount = Math.max(1, Math.floor(enemy.maxHp * ((usedSkill.healPercent || 0) / 100)));
                            enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemyHealAmount);
                            addLog(`${enemy.name}は${usedSkill.name}を使い、HPが${enemyHealAmount}回復した！`);
                        }
                        else if (usedSkill.type === 'buff') {
                            enemy.buffs[usedSkill.stat] += usedSkill.val;
                            addLog(`${enemy.name}は${usedSkill.name}を使った！ 自身の能力が上昇！`);
                        }
                        else if (usedSkill.type === 'debuff') {
                            battlePlayerBuffs[usedSkill.stat] += usedSkill.val;
                            addLog(`${enemy.name}の${usedSkill.name}！ あなたの${STAT_NAMES[usedSkill.stat]}が低下！`);
                        }
                        else if (usedSkill.type === 'enemy_debuff_all') {
                            battlePlayerBuffs.atk -= 0.3;
                            battlePlayerBuffs.def -= 0.3;
                            battlePlayerBuffs.agi -= 0.3;
                            battlePlayerBuffs.yetiDebuffTurns = 5;
                            enemy.yetiNextDebuffTurn = (battle.turnCount || 0) + 6;
                            addLog(`${enemy.name}の${usedSkill.name}！ 攻撃・防御・速度が30%低下した！`);
                        }
                    }
                    else {
                        playSound('damage');
                        triggerShake();
                        if (evasionRoll()) { addLog(`${enemy.name}の攻撃！ しかし回避した！`); continue; }
                        const { dmg, isCrit } = calculateDamage(eAtk, stats.def, enemyLuk, 1, enemy.buffs.atk, battlePlayerBuffs.def);
                        newPlayer.hp -= dmg;
                        addLog(`${enemy.name}の攻撃！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
                    }
                    if (enemy.baseName === RARE_ENEMY_STEEL_SLIME && enemy.hp > 0 && !enemy.escaped) {
                        enemy.fleeTurnCount = (enemy.fleeTurnCount || 0) + 1;
                    }
                }
            }
        }
        // やけど処理：毎ターン最大HPの5%ダメージ
        newEnemies.forEach(e => {
            if (e.hp > 0 && e.burnTurns > 0) {
                const burnDmg = Math.max(1, Math.floor(e.maxHp * 0.05));
                e.hp -= burnDmg;
                e.burnTurns -= 1;
                addLog(`【やけど】${e.name}に${burnDmg}ダメージ！`);
                if (e.burnTurns <= 0)
                    addLog(`【やけど終了】${e.name}のやけどが消えた！`);
            }
        });
        // はがねスライムは、自身が行動したターンのみ数えて5～9ターン経過後に逃走（時間停止中は数えない）
        const currentTurn = (battle.turnCount || 0) + 1;
        newEnemies.forEach(e => {
            if (e.baseName === RARE_ENEMY_STEEL_SLIME && !e.escaped && e.hp > 0 && e.fleeAfterTurns && e.fleeTurnCount >= e.fleeAfterTurns) {
                e.escaped = true;
                e.hp = 0;
                addLog(`【逃走】${e.name}は逃げ出した！`);
            }
        });
        newEnemies.forEach(e => {
            if (e.baseName === BOSS_HG_NAME && e.hgBuffTurns > 0) {
                e.hgBuffTurns -= 1;
                if (e.hgBuffTurns <= 0) {
                    e.buffs.atk = Math.max(0, (e.buffs.atk || 0) - 0.5);
                    e.buffs.agi = Math.max(0, (e.buffs.agi || 0) - 0.5);
                    e.hgEvasion = 0;
                    e.hgNextSwingTurn = (battle.turnCount || 0) + randomInt(1, 3);
                    addLog(`【効果終了】${e.name}の素振り効果が切れた！`);
                }
            }
        });
        if (battlePlayerBuffs.yetiDebuffTurns > 0) {
            battlePlayerBuffs.yetiDebuffTurns -= 1;
            if (battlePlayerBuffs.yetiDebuffTurns <= 0) {
                battlePlayerBuffs.atk += 0.3;
                battlePlayerBuffs.def += 0.3;
                battlePlayerBuffs.agi += 0.3;
                addLog('【効果終了】イエティの妨害効果が切れた！');
            }
        }
        // 一時バフの残りターン処理
        if (battlePlayerBuffs.buffDurations) {
            Object.keys(battlePlayerBuffs.buffDurations).forEach(stat => {
                battlePlayerBuffs.buffDurations[stat] -= 1;
                if (battlePlayerBuffs.buffDurations[stat] <= 0) {
                    if (stat === 'mAtkMult')
                        battlePlayerBuffs.mAtkMult = 1;
                    else if (typeof battlePlayerBuffs[stat] === 'number')
                        battlePlayerBuffs[stat] = 0;
                    delete battlePlayerBuffs.buffDurations[stat];
                    addLog(`【効果終了】${stat}の強化効果が切れた！`);
                }
            });
        }
        if (battlePlayerBuffs.phoenixTurns > 0) {
            newEnemies.filter(e => e.hp > 0).forEach(e => {
                const { dmg } = calculateDamage(stats.mAtk, e.mDef, stats.luk, battlePlayerBuffs.phoenixDotMultiplier || 0.75, battlePlayerBuffs.mAtk || 0, e.buffs.def, e.baseName);
                e.hp -= dmg;
                addLog(`【フェニックス】${e.name}に${dmg}ダメージ！`);
            });
            battlePlayerBuffs.phoenixTurns -= 1;
        }
        if (battlePlayerBuffs.enemyDotTurns > 0) {
            newEnemies.filter(e => e.hp > 0).forEach(e => {
                const { dmg } = calculateDamage(stats.atk, e.def, stats.luk, battlePlayerBuffs.enemyDotMultiplier || 0.75, battlePlayerBuffs.atk || 0, e.buffs.def, e.baseName);
                e.hp -= dmg;
                addLog(`【次元斬・継続】${e.name}に${dmg}ダメージ！`);
            });
            battlePlayerBuffs.enemyDotTurns -= 1;
        }
        if (newPlayer.hp > 0 && newPlayer.equipment?.armor?.id === 'i_yeti_fur') {
            const furHealAmount = Math.max(1, Math.floor(stats.maxHp * 0.05));
            newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + furHealAmount);
            addLog(`【イエティの毛皮】HPが${furHealAmount}回復！`);
        }
        if (newPlayer.hp > 0 && battlePlayerBuffs.autoHealTurns > 0) {
            const autoHealAmount = Math.max(1, Math.floor(stats.maxHp * ((battlePlayerBuffs.autoHealPercent || 10) / 100)));
            newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + autoHealAmount);
            battlePlayerBuffs.autoHealTurns -= 1;
            addLog(`【自動回復】HPが${autoHealAmount}回復した！ 残り${battlePlayerBuffs.autoHealTurns}ターン`);
        }
        let isOver = false;
        let nextTargetId = targetEnemy ? targetEnemy.id : newEnemies.find(e => e.hp > 0)?.id;
        const handleDefeat = () => {
            isOver = true;
            newPlayer.hp = Math.floor(stats.maxHp * 0.2);
            if (battle.isDefense) {
                newPlayer.underAttack = false;
                newPlayer.defenseWinStreak = 0;
                const lostTerritory = Math.min(newPlayer.territory, 2);
                newPlayer.territory -= lostTerritory;
                addLog(`【防衛失敗】領土を${lostTerritory}奪われてしまった...`);
                setTimeout(() => {
                    showToast(`防衛に失敗し、領土が${lostTerritory}減少しました`);
                    setPlayer(newPlayer);
                    persistSave(currentSlot, newPlayer);
                    setGameState('main');
                }, 3000);
            }
            else if (battle.isInvasion) {
                addLog(`【侵略失敗】強大な敵国の返り討ちに遭った...`);
                setTimeout(() => {
                    showToast(`侵略に失敗しました`);
                    setPlayer(newPlayer);
                    persistSave(currentSlot, newPlayer);
                    setGameState('main');
                }, 2500);
            }
            else {
                newPlayer.gold = Math.floor(newPlayer.gold / 2);
                addLog('あなたは倒れてしまった...');
                setTimeout(() => {
                    showToast('所持金が半分になり拠点に戻されました');
                    setPlayer(newPlayer);
                    persistSave(currentSlot, newPlayer);
                    setGameState('main');
                }, 2000);
            }
        };
        if (fled) {
            if (battle.isDefense) {
                handleDefeat();
            }
            else {
                isOver = true;
                setTimeout(() => {
                    newPlayer = checkInvasion(newPlayer);
                    setPlayer(newPlayer);
                    persistSave(currentSlot, newPlayer);
                    setGameState('main');
                }, 1500);
            }
        }
        else if (newPlayer.hp <= 0) {
            handleDefeat();
        }
        else if (newEnemies.every(e => e.hp <= 0 || e.escaped)) {
            let goldBonus = battle.isDefense ? 1.5 : battle.isInvasion ? 2.5 : 1.0;
            if (newPlayer.job === 'merchant')
                goldBonus *= 2.0;
            addLog(battle.isDefense ? `敵軍を撃退した！防衛成功！` : battle.isInvasion ? `敵国拠点を攻略！` : `敵を全滅させた！`);
            const baseTotalExp = newEnemies.reduce((sum, e) => sum + (e.escaped ? 0 : e.exp), 0);
            const expBoostActive = newPlayer.expBoostUntil && newPlayer.expBoostUntil > Date.now();
            const goldPotActive = newPlayer.inventory.some(i => i.id === 'i_gold_pot');
            const goldExpPassiveMultiplier = goldPotActive ? 1.5 : 1.0;
            const totalExp = Math.floor((expBoostActive ? baseTotalExp * 2 : baseTotalExp) * goldExpPassiveMultiplier);
            const totalGold = Math.floor(newEnemies.reduce((sum, e) => sum + (e.escaped ? 0 : e.gold), 0) * goldBonus * goldExpPassiveMultiplier);
            addLog(`${totalExp}の経験値と、${totalGold}Gを手に入れた！`);
            newPlayer.exp += totalExp;
            newPlayer.gold += totalGold;
            if (battle.isDefense) {
                newPlayer.defenseWinStreak = (newPlayer.defenseWinStreak || 0) + 1;
                if (defenseBossEncounter) newPlayer.defenseWinStreak = 0;
            }
            let droppedItems = [];
            newEnemies.filter(e => !e.escaped).forEach(e => {
                // 通常ドロップ：攻撃1%、防御1%、速度1%、万能強化0.3%
                const dropRoll = randomInt(1, 1000);
                if (dropRoll <= 5) {
                    const drop = Object.assign({}, NIGHT_MARKET_POOL[1]);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                else if (dropRoll <= 15) {
                    const drop = Object.assign({}, ENEMY_DROP_ATTACK_POTION);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                else if (dropRoll <= 25) {
                    const drop = Object.assign({}, ENEMY_DROP_DEF_POTION);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                else if (dropRoll <= 35) {
                    const drop = Object.assign({}, ENEMY_DROP_AGI_POTION);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                else if (dropRoll <= 38) {
                    const drop = Object.assign({}, ENEMY_DROP_ALL_POTION);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                else if (dropRoll <= 438) {
                    const drop = Object.assign({}, ENEMY_DROP_HERB);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                else {
                    let dropPool = [SHOP_ITEMS_MORNING[0], SHOP_ITEMS_MORNING[1], SHOP_ITEMS_MORNING[2]];
                    if (e.level > 20)
                        dropPool.push(SHOP_ITEMS_AFTERNOON[1]);
                    if (e.level > 50)
                        dropPool.push(NIGHT_MARKET_POOL[1]);
                    const drop = Object.assign({}, dropPool[randomInt(0, dropPool.length - 1)]);
                    drop.uid = generateId();
                    droppedItems.push(drop);
                }
                // 敵ドロップ：聖水（追加）
                if (Math.random() < 0.05) {
                    const holyWater = Object.assign({}, SHOP_ITEMS_AFTERNOON.find(i => i.id === 'i_ether_hi'));
                    holyWater.uid = generateId();
                    droppedItems.push(holyWater);
                }
                // レアドロップ：金の壺 1%
                if (randomInt(1, 100) === 1) {
                    const rareDrop = Object.assign({}, RARE_DROP_GOLD_POT);
                    rareDrop.uid = generateId();
                    droppedItems.push(rareDrop);
                }
            });
            newEnemies.filter(e => !e.escaped && e.baseName === RARE_ENEMY_YETI).forEach(e => {
                if (Math.random() < 0.30) {
                    const fur = Object.assign({}, ENEMY_DROP_YETI_FUR);
                    fur.uid = generateId();
                    droppedItems.push(fur);
                }
            });
            newEnemies.filter(e => !e.escaped && e.baseName === MID_BOSS_FIRE_GOLEM_NAME).forEach(e => {
                if (Math.random() < 0.05) {
                    const fireSword = Object.assign({}, SHOP_ITEMS_MORNING.find(i => i.id === 'w_fire_sword'));
                    fireSword.uid = generateId();
                    droppedItems.push(fireSword);
                }
                if (Math.random() < 0.50) {
                    const elixir = Object.assign({}, NIGHT_MARKET_POOL.find(i => i.id === 'i_elixir'));
                    elixir.uid = generateId();
                    droppedItems.push(elixir);
                }
            });
            if (droppedItems.length > 0) {
                droppedItems.forEach(d => {
                    const existing = newPlayer.inventory.find(i => i.id === d.id && i.type === 'item');
                    if (existing) {
                        if (existing.amount < 99) {
                            existing.amount += 1;
                            addLog(`魔物が落とした ${d.name} を手に入れた！`);
                        }
                        else {
                            addLog(`魔物が落とした ${d.name} は持てないため捨てた`);
                        }
                    }
                    else {
                        d.amount = 1;
                        newPlayer.inventory.push(d);
                        addLog(`魔物が落とした ${d.name} を手に入れた！`);
                    }
                });
            }
            if (battle.isDefense) {
                newPlayer.underAttack = false;
            }
            else if (battle.isInvasion) {
                newPlayer.territory += 3;
                newPlayer.nations[battle.targetNationId].isDestroyed = true;
                addLog(`【敵国滅亡】敵国の領地を奪い尽くし、滅亡させた！領土が3増加！`);
            }
            else {
                if (battle.direction === 'inside') {
                    addLog(`【領土内巡回】魔物を討伐し、領土の安全を守った！`);
                }
                else {
                    newPlayer.territory += 1;
                    if (battle.direction) {
                        addLog(`【領土拡張】${EXPLORE_DIRECTIONS[battle.direction].name}の領地を開拓し、領土が1増加！`);
                    }
                    else {
                        addLog(`【領土拡張】領地を開拓し、領土が1増加！`);
                    }
                }
            }
            let leveledUp = false;
            while (newPlayer.exp >= calcReqExp(newPlayer.level) && newPlayer.level < MAX_LEVEL) {
                leveledUp = true;
                newPlayer.exp -= calcReqExp(newPlayer.level);
                newPlayer.level++;
                const isNeet = newPlayer.job === 'neet';
                const growthMult = isNeet ? 1.5 : 1.0;
                const spGain = isNeet ? 20 : 10;
                newPlayer.sp += spGain;
                newPlayer.baseStats.maxHp += Math.floor(randomInt(5, 10) * 4 * 5 * growthMult);
                newPlayer.baseStats.maxMp += Math.floor(randomInt(1, 3) * 1.5 * growthMult);
                newPlayer.baseStats.atk += Math.floor(randomInt(1, 3) * growthMult);
                newPlayer.baseStats.def += Math.floor(randomInt(1, 3) * growthMult);
                newPlayer.baseStats.mAtk += Math.floor(randomInt(1, 3) * growthMult);
                newPlayer.baseStats.mDef += Math.floor(randomInt(1, 3) * growthMult);
                newPlayer.baseStats.agi += Math.floor(randomInt(1, 3) * growthMult);
                newPlayer.baseStats.luk += Math.floor(randomInt(1, 2) * growthMult);
                addLog(`レベルが${newPlayer.level}に上がった！SPを${spGain}獲得！`);
            }
            if (leveledUp) {
                const newStats = getStats(newPlayer);
                newPlayer.hp = newStats.maxHp;
                newPlayer.mp = newStats.maxMp;
                addLog(`レベルアップ効果により、HPとMPが全回復した！`);
            }
            isOver = true;
            setTimeout(() => {
                if (!battle.isDefense)
                    newPlayer = checkInvasion(newPlayer);
                setPlayer(newPlayer);
                persistSave(currentSlot, newPlayer);
                setGameState('main');
            }, 3000);
        }
        else {
            if (!newEnemies.find(e => e.id === nextTargetId && e.hp > 0)) {
                nextTargetId = newEnemies.find(e => e.hp > 0)?.id;
            }
        }
        setPlayer(newPlayer);
        setBattle({ ...battle, enemies: newEnemies, logs, isOver, selectedTargetId: nextTargetId, playerBuffs: battlePlayerBuffs, turnCount: currentTurn });
    };
    const useItemInBattle = (item) => {
        if (item.id === 'i_gold_pot')
            return showToast('金の壺は使用できません');
        let newInventory = [...player.inventory];
        const itemIndex = newInventory.findIndex(i => i.uid === item.uid);
        if (itemIndex !== -1) {
            if (newInventory[itemIndex].amount > 1) {
                newInventory[itemIndex] = { ...newInventory[itemIndex], amount: newInventory[itemIndex].amount - 1 };
            }
            else {
                newInventory.splice(itemIndex, 1);
            }
        }
        let newPlayer = { ...player, inventory: newInventory };
        const stats = getStats(newPlayer);
        let logs = [...battle.logs];
        playSound('magic');
        if (item.healPercent) {
            const healAmount = Math.floor(stats.maxHp * item.healPercent / 100);
            newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + healAmount);
            logs.push(`【クイック使用】${item.name}を使った！ HPが${item.healPercent}%回復した！`);
        }
        if (item.cureStatus) {
            newPlayer.burnTurns = 0;
            if (newPlayer.buffs) newPlayer.buffs.stun = 0;
            logs.push(`【状態異常解除】${item.name}で状態異常を解除した！`);
        }
        if (item.healMp) {
            newPlayer.mp = Math.min(stats.maxMp, newPlayer.mp + item.healMp);
            logs.push(`【クイック使用】${item.name}を使った！ MPが回復した！`);
        }
        if (item.mpPercent) {
            const mpAmount = Math.floor(stats.maxMp * item.mpPercent / 100);
            newPlayer.mp = Math.min(stats.maxMp, newPlayer.mp + mpAmount);
            logs.push(`【クイック使用】${item.name}を使った！ MPが${item.mpPercent}%回復した！`);
        }
        if (item.expBoostMinutes) {
            newPlayer.expBoostUntil = Date.now() + item.expBoostMinutes * 60 * 1000;
            logs.push(`【クイック使用】${item.name}を使った！ 30分間、獲得経験値が2倍になる！`);
        }
        if (item.regenPercent) {
            battle.playerBuffs.autoHealTurns = item.regenTurns || 5;
            battle.playerBuffs.autoHealPercent = item.regenPercent;
            logs.push(`【クイック使用】${item.name}を使った！ ${battle.playerBuffs.autoHealTurns}ターンの間、毎ターン最大HPの${item.regenPercent}%回復する！`);
        }
        if (item.id === 'i_all_buff_potion') {
            battle.playerBuffs.atk = (battle.playerBuffs.atk || 0) + 0.1;
            battle.playerBuffs.def = (battle.playerBuffs.def || 0) + 0.1;
            battle.playerBuffs.agi = (battle.playerBuffs.agi || 0) + 0.1;
            battle.playerBuffs.buffDurations.atk = 5;
