<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Territory RPG</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes pulse-red {
      0%, 100% { box-shadow: inset 0 0 20px rgba(239, 68, 68, 0.2); }
      50% { box-shadow: inset 0 0 50px rgba(239, 68, 68, 0.6); }
    }
    .bg-alert { animation: pulse-red 2s infinite; }
  </style>
</head>
<body class="bg-black m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ストレージ管理ヘルパー
    const StorageManager = {
      setItem: (key, value) => {
        try {
          localStorage.setItem(key, value);
        } catch (e) {
          document.cookie = `${key}=${encodeURIComponent(value)}; max-age=31536000; path=/`;
        }
      },
      getItem: (key) => {
        try {
          const val = localStorage.getItem(key);
          if (val) return val;
        } catch (e) {}
        const match = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
        if (match) return decodeURIComponent(match[2]);
        return null;
      }
    };

    // --- ゲームデータ定義 ---
    const AVATARS = ['😊', '😎', '🤠', '🥷', '🧙‍♂️', '🧛‍♂️', '🤖', '🐱'];

    // 他国データ定義
    const INITIAL_NATIONS = {
      granbell: {
        id: 'granbell',
        name: 'グランベル王国',
        icon: '👑',
        color: 'border-yellow-500 bg-yellow-950/40 text-yellow-300',
        desc: '伝統ある商業大国。豊かな交易ルートを持つ。',
        relation: 'neutral', // neutral, allied, hostile
        tradeLevel: 0,
        allianceCost: 1000,
        tradeCost: 500,
        power: 12
      },
      rune: {
        id: 'rune',
        name: 'ルーンフォレスト',
        icon: '🧝‍♀️',
        color: 'border-emerald-500 bg-emerald-950/40 text-emerald-300',
        desc: '森に護られた魔法国家。防衛技術と薬草加工に長ける。',
        relation: 'neutral',
        tradeLevel: 0,
        allianceCost: 1500,
        tradeCost: 600,
        power: 18
      },
      barzac: {
        id: 'barzac',
        name: 'バルザック帝国',
        icon: '⚔️',
        color: 'border-purple-500 bg-purple-950/40 text-purple-300',
        desc: '好戦的な軍事国家。高い武力と領土拡張欲を持つ。',
        relation: 'neutral',

    };

    const INITIAL_ITEMS = {
      weapon: { id: 'w_knife', name: '木のナイフ', type: 'weapon', atk: 1, def: 0, agi: 0, price: 50, desc: '初期装備のナイフ' },
      armor: { id: 'a_jersey', name: 'ジャージ', type: 'armor', atk: 0, def: 1, agi: 0, price: 50, desc: '動きやすい服' },
      shoes: { id: 's_shoes', name: '運動靴', type: 'shoes', atk: 0, def: 1, agi: 1, price: 50, desc: '普通の靴' }
    };

    const SHOP_ITEMS = [
      { id: 'i_potion', name: '傷薬', type: 'item', healHp: 50, price: 50, desc: 'HPを50回復' },
      { id: 'i_potion_hi', name: '上傷薬', type: 'item', healHp: 150, price: 150, desc: 'HPを150回復' },
      { id: 'w_sword_iron', name: '鉄の剣', type: 'weapon', atk: 5, def: 0, agi: 0, price: 300, desc: '攻撃+5' },
      { id: 'w_sword_steel', name: '鋼の剣', type: 'weapon', atk: 12, def: 0, agi: 0, price: 800, desc: '攻撃+12' },
      { id: 'w_axe_battle', name: '戦斧', type: 'weapon', atk: 18, def: 0, agi: -2, price: 1500, desc: '攻撃+18, 速さ-2' },
      { id: 'a_leather', name: '皮の鎧', type: 'armor', atk: 0, def: 5, agi: 0, price: 300, desc: '防御+5' },
      { id: 'a_chain', name: '鎖帷子', type: 'armor', atk: 0, def: 10, agi: -1, price: 750, desc: '防御+10, 速さ-1' },
      { id: 'a_plate', name: 'プレートメイル', type: 'armor', atk: 0, def: 18, agi: -3, price: 1600, desc: '防御+18, 速さ-3' },
      { id: 's_leather', name: '革の靴', type: 'shoes', atk: 0, def: 1, agi: 3, price: 200, desc: '防御+1, 速さ+3' },
      { id: 's_boots', name: '鉄のブーツ', type: 'shoes', atk: 0, def: 4, agi: -1, price: 400, desc: '防御+4, 速さ-1' },
    ];

    const SKILLS_DATA = {
      'heavy_strike': { name: '強撃', type: 'attack', target: 'single', mpCost: 3, multiplier: 1.5, desc: '単体に1.5倍の物理攻撃' },
      'double_slash': { name: '二連斬り', type: 'attack_multi', target: 'single', mpCost: 5, multiplier: 0.8, hits: 2, desc: '単体に0.8倍の2回連続攻撃' },
      'whirlwind': { name: '旋風斬', type: 'attack', target: 'all', mpCost: 8, multiplier: 0.9, desc: '敵全体に0.9倍の物理攻撃' },
      'fatal_blow': { name: '鬼神の一撃', type: 'attack', target: 'single', mpCost: 12, multiplier: 2.5, desc: '単体に2.5倍の強力な物理攻撃' },
      'heal_light': { name: '治癒', type: 'heal', target: 'self', mpCost: 5, healHp: 60, desc: 'HPを60回復' },
      'heal_mid': { name: '中治癒', type: 'heal', target: 'self', mpCost: 12, healHp: 150, desc: 'HPを150回復' },
      'fireball': { name: '火球', type: 'magic', target: 'single', mpCost: 6, multiplier: 1.8, desc: '単体に防御の影響を受けにくい魔法攻撃' },
      'ice_lance': { name: '氷槍', type: 'magic', target: 'single', mpCost: 12, multiplier: 2.8, desc: '単体に強力な魔法攻撃' },
      'fire_storm': { name: '炎の嵐', type: 'magic', target: 'all', mpCost: 18, multiplier: 1.5, desc: '敵全体に魔法攻撃' },
    };

    const SKILL_TREE = [
      { id: 'hp_1', name: '体力強化I', desc: '最大HP+10', cost: 1, type: 'stat', stat: 'maxHp', val: 10, req: [] },
      { id: 'hp_2', name: '体力強化II', desc: '最大HP+25', cost: 2, type: 'stat', stat: 'maxHp', val: 25, req: ['hp_1'] },
      { id: 'hp_3', name: '体力強化III', desc: '最大HP+50', cost: 3, type: 'stat', stat: 'maxHp', val: 50, req: ['hp_2'] },
      { id: 'atk_1', name: '筋力強化I', desc: '攻撃+3', cost: 1, type: 'stat', stat: 'atk', val: 3, req: [] },
      { id: 'atk_2', name: '筋力強化II', desc: '攻撃+6', cost: 2, type: 'stat', stat: 'atk', val: 6, req: ['atk_1'] },
      { id: 'atk_3', name: '筋力強化III', desc: '攻撃+10', cost: 3, type: 'stat', stat: 'atk', val: 10, req: ['atk_2'] },
      { id: 'def_1', name: '頑強I', desc: '防御+3', cost: 1, type: 'stat', stat: 'def', val: 3, req: [] },
      { id: 'def_2', name: '頑強II', desc: '防御+6', cost: 2, type: 'stat', stat: 'def', val: 6, req: ['def_1'] },
      { id: 'def_3', name: '頑強III', desc: '防御+10', cost: 3, type: 'stat', stat: 'def', val: 10, req: ['def_2'] },
      { id: 'agi_1', name: '俊敏I', desc: '速さ+3', cost: 1, type: 'stat', stat: 'agi', val: 3, req: [] },
      { id: 'agi_2', name: '俊敏II', desc: '速さ+5', cost: 2, type: 'stat', stat: 'agi', val: 5, req: ['agi_1'] },
      { id: 'luk_1', name: '幸運I', desc: '運+3 (会心率UP)', cost: 1, type: 'stat', stat: 'luk', val: 3, req: [] },
      { id: 'luk_2', name: '幸運II', desc: '運+5 (会心率UP)', cost: 2, type: 'stat', stat: 'luk', val: 5, req: ['luk_1'] },
      
      { id: 'skill_heavy', name: 'スキル: 強撃', desc: '単体物理 (MP3)', cost: 2, type: 'skill', skillId: 'heavy_strike', req: ['atk_1'] },
      { id: 'skill_double', name: 'スキル: 二連斬り', desc: '単体2回物理 (MP5)', cost: 4, type: 'skill', skillId: 'double_slash', req: ['skill_heavy', 'agi_1'] },
      { id: 'skill_whirl', name: 'スキル: 旋風斬', desc: '全体物理 (MP8)', cost: 5, type: 'skill', skillId: 'whirlwind', req: ['skill_double', 'atk_2'] },
      { id: 'skill_fatal', name: 'スキル: 鬼神の一撃', desc: '単体強力物理 (MP12)', cost: 6, type: 'skill', skillId: 'fatal_blow', req: ['skill_whirl', 'atk_3'] },
      
      { id: 'skill_heal', name: 'スキル: 治癒', desc: 'HP60回復 (MP5)', cost: 2, type: 'skill', skillId: 'heal_light', req: ['hp_1'] },
      { id: 'skill_heal_m', name: 'スキル: 中治癒', desc: 'HP150回復 (MP12)', cost: 4, type: 'skill', skillId: 'heal_mid', req: ['skill_heal', 'hp_3'] },
      
      { id: 'skill_fire', name: 'スキル: 火球', desc: '単体魔法 (MP6)', cost: 3, type: 'skill', skillId: 'fireball', req: ['atk_2'] },
      { id: 'skill_ice', name: 'スキル: 氷槍', desc: '単体強力魔法 (MP12)', cost: 5, type: 'skill', skillId: 'ice_lance', req: ['skill_fire'] },
      { id: 'skill_storm', name: 'スキル: 炎の嵐', desc: '全体魔法 (MP18)', cost: 7, type: 'skill', skillId: 'fire_storm', req: ['skill_ice'] },
    ];

    const ENEMY_NAMES = ["スライム", "ゴブリン", "大コウモリ", "野生の狼", "オーク", "スケルトン", "リビングアーマー", "キメラ", "ドラゴンパピー", "魔王の幻影"];

    const getMapSpiral = (max) => {
      let x = 0, y = 0, dx = 0, dy = -1;
      const coords = [];
      for (let i = 0; i < max; i++) {
        if (-11/2 < x && x <= 11/2 && -11/2 < y && y <= 11/2) coords.push({x, y});
        if (x === y || (x < 0 && x === -y) || (x > 0 && x === 1 - y)) {
          let temp = dx; dx = -dy; dy = temp;
        }
        x += dx; y += dy;
      }
      return coords;
    };

    const MAP_COORDS = getMapSpiral(121);
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const getSaveKey = (slot) => `territory_rpg_save_slot_${slot}`;

    function App() {
      const [gameState, setGameState] = useState('title'); // title, slots_load, slots_save, slots_create, create, main, battle, shop, skill, inventory, map, diplomacy
      const [currentSlot, setCurrentSlot] = useState(1);
      const [toastMsg, setToastMsg] = useState(null);
      const [player, setPlayer] = useState(null);
      const [battle, setBattle] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [createData, setCreateData] = useState({ name: '', avatar: AVATARS[0] });

      const logsEndRef = useRef(null);

      useEffect(() => {
        if (toastMsg) {
          const timer = setTimeout(() => setToastMsg(null), 2500);
          return () => clearTimeout(timer);
        }
      }, [toastMsg]);

      useEffect(() => {
        if (gameState === 'battle' && logsEndRef.current) {
          logsEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [battle?.logs]);

      const showToast = (msg) => setToastMsg(msg);

      const persistSave = (slotNum, playerData) => {
        if (!playerData) return;
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
        const saveObj = {
          ...playerData,
          lastSave: timeStr
        };
        StorageManager.setItem(getSaveKey(slotNum), JSON.stringify(saveObj));
        return saveObj;
      };

      const getStats = (currentPlayer = player) => {
        if (!currentPlayer) return null;
        let stats = { ...currentPlayer.baseStats };
        currentPlayer.unlockedNodes.forEach(nodeId => {
          const node = SKILL_TREE.find(n => n.id === nodeId);
          if (node && node.type === 'stat') stats[node.stat] += node.val;
        });
        ['weapon', 'armor', 'shoes'].forEach(slot => {
          const eq = currentPlayer.equipment[slot];
          if (eq) {
            stats.atk += eq.atk || 0;
            stats.def += eq.def || 0;
            stats.agi += eq.agi || 0;
          }
        });
        return stats;
      };

      // ターン毎の貿易収入と敵侵攻計算
      const processTurnIncomeAndInvasion = (currentPlayer) => {
        let updatedPlayer = { ...currentPlayer };
        
        // 貿易収入の計算
        let tradeIncome = 0;
        Object.values(updatedPlayer.nations || {}).forEach(n => {
          if (n.tradeLevel > 0) {
            tradeIncome += n.tradeLevel * 50 + Math.floor(updatedPlayer.territory * 10);
          }
        });

        if (tradeIncome > 0) {
          updatedPlayer.gold += tradeIncome;
          showToast(`貿易収入として ${tradeIncome}G 獲得！`);
        }

        // 侵攻確率の判定
        if (updatedPlayer.territory > 0 && !updatedPlayer.underAttack) {
          if (randomInt(1, 100) <= 22) {
            updatedPlayer.underAttack = true;
            showToast('【警報】敵軍が自国領土に侵攻してきました！');
          }
        }
        return updatedPlayer;
      };

      const initGame = () => {
        if (!createData.name.trim()) return showToast('名前を入力してください');

        const baseStats = { maxHp: randomInt(50, 100), maxMp: randomInt(0, 10), atk: randomInt(10, 15), def: randomInt(5, 10), agi: randomInt(5, 10), luk: randomInt(1, 10) };
        const w = { ...INITIAL_ITEMS.weapon, uid: generateId() };
        const a = { ...INITIAL_ITEMS.armor, uid: generateId() };
        const s = { ...INITIAL_ITEMS.shoes, uid: generateId() };

        const newPlayerData = {
          name: createData.name, avatar: createData.avatar, level: 1, exp: 0, gold: 1000, sp: 10, territory: 1,
          baseStats, hp: baseStats.maxHp, mp: baseStats.maxMp, equipment: { weapon: w, armor: a, shoes: s },
          inventory: [w, a, s], skills: [], unlockedNodes: [], underAttack: false, 
          nations: JSON.parse(JSON.stringify(INITIAL_NATIONS)), lastSave: null
        };

        const savedData = persistSave(currentSlot, newPlayerData);
        setPlayer(savedData);
        setGameState('main');
        showToast(`スロット${currentSlot}で開始＆セーブしました！`);
      };

      const saveGameToSlot = (slotNum) => {
        if (!player) return;
        const savedData = persistSave(slotNum, player);
        setPlayer(savedData);
        setCurrentSlot(slotNum);
        showToast(`スロット${slotNum}にセーブしました`);
        setGameState('main');
      };

      const loadGameFromSlot = (slotNum) => {
        const data = StorageManager.getItem(getSaveKey(slotNum));
        if (data) { 
          try {
            const parsed = JSON.parse(data);
            if (!parsed.nations) parsed.nations = JSON.parse(JSON.stringify(INITIAL_NATIONS));
            setPlayer(parsed); 
            setCurrentSlot(slotNum);
            setGameState('main'); 
            showToast(`スロット${slotNum}をロードしました`); 
          } catch(e) {
            showToast('データのロードに失敗しました');
          }
        } else {
          showToast('セーブデータがありません');
        }
      };

      const getSaveDataInfo = (slotNum) => {
        const data = StorageManager.getItem(getSaveKey(slotNum));
        if (data) {
          try {
            const parsed = JSON.parse(data);
            return { exists: true, name: parsed.name, level: parsed.level, territory: parsed.territory, time: parsed.lastSave };
          } catch(e) {}
        }
        return { exists: false };
      };

      const isMerchantAvailable = () => {
        const hour = new Date().getHours();
        return (hour >= 7 && hour < 11) || (hour >= 15 && hour < 20);
      };

      const handleShopClick = () => {
        if (player.underAttack) return showToast('敵が侵攻中です！買い物をしている場合ではありません！');
        if (isMerchantAvailable()) setGameState('shop');
        else showToast('今は商人がいないようだ...(営業: 7~10時, 15~19時)');
      };

      const buyItem = (item) => {
        if (player.gold < item.price) return showToast('ゴールドが足りません');
        let newInventory = [...player.inventory];
        if (item.type === 'item') {
          const existing = newInventory.find(i => i.id === item.id);
          if (existing) existing.amount = (existing.amount || 1) + 1;
          else newInventory.push({ ...item, uid: generateId(), amount: 1 });
        } else {
          newInventory.push({ ...item, uid: generateId() });
        }
        const newPlayer = { ...player, gold: player.gold - item.price, inventory: newInventory };
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${item.name}を購入しました`);
      };

      // 外交アクション（同盟、貿易拡張、侵略）
      const handleAlliance = (nationId) => {
        const nation = player.nations[nationId];
        if (player.gold < nation.allianceCost) return showToast('ゴールドが足りません');
        
        let newPlayer = { ...player, gold: player.gold - nation.allianceCost };
        newPlayer.nations[nationId].relation = 'allied';
        
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${nation.name}と同盟を締結しました！`);
      };

      const handleTrade = (nationId) => {
        const nation = player.nations[nationId];
        const cost = nation.tradeCost * (nation.tradeLevel + 1);
        if (player.gold < cost) return showToast('ゴールドが足りません');

        let newPlayer = { ...player, gold: player.gold - cost };
        newPlayer.nations[nationId].tradeLevel += 1;
        
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${nation.name}との貿易レベルが ${newPlayer.nations[nationId].tradeLevel} に上がりました！`);
      };

      // 戦闘開始（防衛戦、通常探索、他国侵略）
      const startBattle = (type = 'explore', targetNationId = null) => {
        const isDefense = type === 'defense';
        const isInvasion = type === 'invasion';
        
        let terriLevel = Math.max(1, Math.floor(player.territory / 2) + (isDefense ? 2 : 1));
        if (isInvasion) {
          terriLevel = Math.floor(player.nations[targetNationId].power / 2);
        }

        const maxEnemies = Math.min(3, Math.ceil(terriLevel / 3) + 1);
        const enemyCount = randomInt(isDefense || isInvasion ? 2 : 1, maxEnemies);
        
        const generatedEnemies = [];
        const nameCounts = {};
        const enemyBaseLevel = Math.min(terriLevel - 1, ENEMY_NAMES.length - 1);

        for(let i=0; i<enemyCount; i++) {
          let baseName = ENEMY_NAMES[Math.max(0, enemyBaseLevel - randomInt(0, 2))] || "謎の魔物";
          if (isInvasion) {
            baseName = `${player.nations[targetNationId].name}兵`;
          }
          nameCounts[baseName] = (nameCounts[baseName] || 0) + 1;
          
          const statMultiplier = (enemyCount > 1 ? 0.8 : 1.0) * (isDefense || isInvasion ? 1.2 : 1.0);
          const maxHp = Math.floor(randomInt(25 + terriLevel * 10, 45 + terriLevel * 15) * statMultiplier);
          
          generatedEnemies.push({
            id: generateId(),
            baseName,
            level: terriLevel,
            maxHp, hp: maxHp,
            atk: Math.floor(randomInt(8 + terriLevel * 2, 12 + terriLevel * 4) * statMultiplier),
            def: Math.floor(randomInt(2 + terriLevel * 2, 5 + terriLevel * 3) * statMultiplier),
            agi: Math.floor(randomInt(5 + terriLevel * 2, 10 + terriLevel * 3)),
            exp: Math.floor((18 + terriLevel * 8) * statMultiplier),
            gold: Math.floor((35 + terriLevel * 12) * statMultiplier)
          });
        }

        const nameCurrent = {};
        generatedEnemies.forEach(e => {
          if (nameCounts[e.baseName] > 1) {
            nameCurrent[e.baseName] = (nameCurrent[e.baseName] || 0) + 1;
            e.name = `${e.baseName}${String.fromCharCode(64 + nameCurrent[e.baseName])}`;
          } else {
            e.name = e.baseName;
          }
        });

        // 同盟国の支援チェック
        let allyHelp = null;
        if (isDefense) {
          const alliedNations = Object.values(player.nations).filter(n => n.relation === 'allied');
          if (alliedNations.length > 0) {
            allyHelp = alliedNations[randomInt(0, alliedNations.length - 1)];
          }
        }

        const initialLogs = [];
        if (isDefense) {
          initialLogs.push(`敵軍が領土に攻め込んできた！防衛せよ！`);
          if (allyHelp) {
            initialLogs.push(`同盟国【${allyHelp.name}】の援軍が駆けつけた！(全味方ステータス強化)`);
          }
        } else if (isInvasion) {
          initialLogs.push(`【${player.nations[targetNationId].name}】へ侵攻を開始！`);
        } else {
          initialLogs.push(`魔物が現れた！`);
        }

        setBattle({
          isDefense,
          isInvasion,
          targetNationId,
          allyHelp,
          enemies: generatedEnemies,
          logs: initialLogs,
          isOver: false,
          selectedTargetId: generatedEnemies[0].id
        });
        setGameState('battle');
      };

      const processTurn = (actionType, skillData = null, itemData = null) => {
        if (battle.isOver) return;

        let newPlayer = { ...player };
        let newEnemies = battle.enemies.map(e => ({...e}));
        let logs = [...battle.logs];
        let stats = getStats(newPlayer);

        // 同盟軍援軍によるバフ補正
        if (battle.allyHelp) {
          stats.atk = Math.floor(stats.atk * 1.25);
          stats.def = Math.floor(stats.def * 1.25);
        }

        const addLog = (msg) => logs.push(msg);
        let targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);

        const actors = [
          { isPlayer: true, agi: stats.agi },
          ...newEnemies.filter(e => e.hp > 0).map(e => ({ isPlayer: false, id: e.id, agi: e.agi }))
        ].sort((a, b) => b.agi - a.agi);

        const calculateDamage = (attackerAtk, defenderDef, attackerLuk, multiplier = 1, isMagic = false) => {
          const critChance = Math.min(50, attackerLuk * 1.5);
          const isCrit = randomInt(1, 100) <= critChance;
          const defFactor = isMagic ? Math.floor(defenderDef / 4) : Math.floor(defenderDef / 2);
          let dmg = Math.max(1, Math.floor(attackerAtk * multiplier) - defFactor);
          if (isCrit) dmg = Math.floor(dmg * 2);
          return { dmg, isCrit };
        };

        let fled = false;

        for (let actor of actors) {
          if (newPlayer.hp <= 0) break;
          if (newEnemies.every(e => e.hp <= 0)) break;

          if (actor.isPlayer) {
            if (actionType === 'flee') {
              if (battle.isDefense) {
                addLog('防衛戦からは逃げられない！領土を見捨てることになる！');
                fled = true; break;
              } else {
                const avgAgi = newEnemies.reduce((sum, e) => sum + e.agi, 0) / newEnemies.length;
                if (randomInt(1, 100) <= 50 + stats.agi - avgAgi) {
                  addLog('逃げ出すことに成功した！');
                  fled = true; break;
                } else {
                  addLog('逃げられなかった！');
                }
              }
            } 
            else if (actionType === 'attack') {
              targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
              const { dmg, isCrit } = calculateDamage(stats.atk, targetEnemy.def, stats.luk);
              targetEnemy.hp -= dmg;
              addLog(`あなたの攻撃！ ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
            } 
            else if (actionType === 'skill' && skillData) {
              if (newPlayer.mp < skillData.mpCost) {
                addLog(`MPが足りない！`);
              } else {
                newPlayer.mp -= skillData.mpCost;
                if (skillData.target === 'all') {
                  addLog(`${skillData.name}！`);
                  newEnemies.filter(e => e.hp > 0).forEach(e => {
                    const { dmg, isCrit } = calculateDamage(stats.atk, e.def, stats.luk, skillData.multiplier, skillData.type === 'magic');
                    e.hp -= dmg;
                    addLog(` -> ${e.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                  });
                } else if (skillData.type === 'heal') {
                  newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + skillData.healHp);
                  addLog(`${skillData.name}！ HPが${skillData.healHp}回復した！`);
                } else {
                  targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                  if (skillData.type === 'attack_multi') {
                    addLog(`${skillData.name}！`);
                    for (let i = 0; i < skillData.hits; i++) {
                      if (targetEnemy.hp <= 0) break;
                      const { dmg, isCrit } = calculateDamage(stats.atk, targetEnemy.def, stats.luk, skillData.multiplier);
                      targetEnemy.hp -= dmg;
                      addLog(` -> ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                    }
                  } else {
                    const { dmg, isCrit } = calculateDamage(stats.atk, targetEnemy.def, stats.luk, skillData.multiplier, skillData.type === 'magic');
                    targetEnemy.hp -= dmg;
                    addLog(`${skillData.name}！ ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                  }
                }
              }
            } 
            else if (actionType === 'item' && itemData) {
              newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + itemData.healHp);
              addLog(`${itemData.name}を使った！ HPが回復した！`);
            }

          } else {
            const enemy = newEnemies.find(e => e.id === actor.id);
            if (enemy && enemy.hp > 0) {
              const enemyLuk = Math.min(20, enemy.level * 2);
              const { dmg, isCrit } = calculateDamage(enemy.atk, stats.def, enemyLuk);
              newPlayer.hp -= dmg;
              addLog(`${enemy.name}の攻撃！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
            }
          }
        } 

        let isOver = false;
        let nextTargetId = targetEnemy ? targetEnemy.id : newEnemies.find(e => e.hp > 0)?.id;

        const handleDefeat = () => {
          isOver = true;
          newPlayer.hp = Math.floor(stats.maxHp * 0.2);
          
          if (battle.isDefense) {
            newPlayer.underAttack = false;
            const lostTerritory = Math.min(newPlayer.territory, 2);
            newPlayer.territory -= lostTerritory;
            addLog(`【防衛失敗】領土を${lostTerritory}奪われてしまった...`);
            setTimeout(() => { 
              showToast(`防衛に失敗し、領土が${lostTerritory}減少しました`);
              setPlayer(newPlayer); 
              persistSave(currentSlot, newPlayer);
              setGameState('main'); 
            }, 3000);
          } else if (battle.isInvasion) {
            addLog(`【侵略失敗】敵国の返り討ちに遭った...`);
            setTimeout(() => { 
              showToast(`侵略に失敗しました`);
              setPlayer(newPlayer); 
              persistSave(currentSlot, newPlayer);
              setGameState('main'); 
            }, 2500);
          } else {
            newPlayer.gold = Math.floor(newPlayer.gold / 2);
            addLog('あなたは倒れてしまった...');
            setTimeout(() => { 
              showToast('所持金が半分になり拠点に戻されました');
              setPlayer(newPlayer); 
              persistSave(currentSlot, newPlayer);
              setGameState('main'); 
            }, 2000);
          }
        };

        if (fled) {
          if (battle.isDefense) {
            handleDefeat();
          } else {
            isOver = true;
            setTimeout(() => { 
              newPlayer = processTurnIncomeAndInvasion(newPlayer);
              setPlayer(newPlayer); 
              persistSave(currentSlot, newPlayer);
              setGameState('main'); 
            }, 1500);
          }
        } else if (newPlayer.hp <= 0) {
          handleDefeat();
        } else if (newEnemies.every(e => e.hp <= 0)) {
          let goldBonus = battle.isDefense ? 1.5 : battle.isInvasion ? 2.5 : 1.0;
          addLog(battle.isDefense ? `敵軍を撃退した！防衛成功！` : battle.isInvasion ? `敵国拠点を攻略！` : `敵を全滅させた！`);
          
          const totalExp = newEnemies.reduce((sum, e) => sum + e.exp, 0);
          const totalGold = Math.floor(newEnemies.reduce((sum, e) => sum + e.gold, 0) * goldBonus);
          addLog(`${totalExp}の経験値と、${totalGold}Gを手に入れた！`);
          
          newPlayer.exp += totalExp;
          newPlayer.gold += totalGold;
          
          if (battle.isDefense) {
            newPlayer.underAttack = false;
          } else if (battle.isInvasion) {
            newPlayer.territory += 3; // 侵略成功時は領土+3
            newPlayer.nations[battle.targetNationId].relation = 'hostile'; // 敵対関係へ
            addLog(`【領土拡張】敵国の領地を奪い、領土が3増加！`);
          } else {
            newPlayer.territory += 1; 
          }

          let requiredExp = newPlayer.level * 20;
          while (newPlayer.exp >= requiredExp) {
            newPlayer.exp -= requiredExp;
            newPlayer.level++;
            newPlayer.sp += 10;
            
            newPlayer.baseStats.maxHp += randomInt(5, 10);
            newPlayer.baseStats.maxMp += randomInt(1, 3);
            newPlayer.baseStats.atk += randomInt(1, 3);
            newPlayer.baseStats.def += randomInt(1, 3);
            newPlayer.baseStats.agi += randomInt(1, 3);
            newPlayer.baseStats.luk += randomInt(1, 2);
            
            addLog(`レベルが${newPlayer.level}に上がった！SPを10獲得！`);
            requiredExp = newPlayer.level * 20;
          }
          
          isOver = true;
          setTimeout(() => { 
            if (!battle.isDefense) newPlayer = processTurnIncomeAndInvasion(newPlayer);
            setPlayer(newPlayer); 
            persistSave(currentSlot, newPlayer);
            setGameState('main'); 
          }, 2500);
        } else {
           if (!newEnemies.find(e => e.id === nextTargetId && e.hp > 0)) {
               nextTargetId = newEnemies.find(e => e.hp > 0)?.id;
           }
        }

        setPlayer(newPlayer);
        setBattle({ ...battle, enemies: newEnemies, logs, isOver, selectedTargetId: nextTargetId });
      };

      const useItemInBattle = (item) => {
        let newInventory = [...player.inventory];
        const itemIndex = newInventory.findIndex(i => i.uid === item.uid);
        if (newInventory[itemIndex].amount > 1) newInventory[itemIndex].amount -= 1;
        else newInventory.splice(itemIndex, 1);
        setPlayer({ ...player, inventory: newInventory });
        setSelectedItem(null);
        processTurn('item', null, item);
      };

      const equipItem = (item) => {
        let newEquip = { ...player.equipment };
        newEquip[item.type] = item;
        const newPlayer = { ...player, equipment: newEquip };
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${item.name}を装備しました`);
        setSelectedItem(null);
      };

      const useItemField = (item) => {
        const stats = getStats();
        if (player.hp >= stats.maxHp) return showToast('HPは満タンです');
        let newHp = Math.min(stats.maxHp, player.hp + item.healHp);
        
        let newInventory = [...player.inventory];
        const itemIndex = newInventory.findIndex(i => i.uid === item.uid);
        if (newInventory[itemIndex].amount > 1) newInventory[itemIndex].amount -= 1;
        else newInventory.splice(itemIndex, 1);
        
        const newPlayer = { ...player, hp: newHp, inventory: newInventory };
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${item.name}を使用し、HPが回復しました`);
        setSelectedItem(null);
      };

      const unlockSkill = (node) => {
        if (player.sp < node.cost) return showToast('割り振りポイント(SP)が足りません');
        
        let newPlayer = { ...player };
        newPlayer.sp -= node.cost;
        newPlayer.unlockedNodes.push(node.id);

        if (node.type === 'skill') {
          newPlayer.skills.push(node.skillId);
          showToast(`スキル「${node.name}」を習得した！`);
        } else {
          showToast(`能力「${node.name}」を解放した！`);
          if (node.stat === 'maxHp') newPlayer.hp += node.val;
          if (node.stat === 'maxMp') newPlayer.mp += node.val;
        }
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
      };

      // ==========================================
      // レンダリング関数
      // ==========================================

      const renderTitle = () => (

            </h1>

            <button onClick={() => setGameState('slots_create')} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-transform active:scale-95 flex items-center justify-center gap-2">
              <i className="fa-solid fa-play"></i> はじめから
            </button>
            <button onClick={() => setGameState('slots_load')} className="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2">
              <i className="fa-solid fa-floppy-disk"></i> つづきから
            </button>
          </div>

              <div className="flex justify-between items-center mb-3">
                <div className="flex items-center gap-3">
                  <div className={`text-4xl bg-gray-700 p-2 rounded-full h-14 w-14 flex items-center justify-center border ${player.underAttack ? 'border-red-500 animate-pulse' : 'border-gray-600'}`}>{player.avatar}</div>
                  <div>
                    <div className="font-bold text-lg">{player.name} <span className="text-yellow-400 text-sm font-normal">Lv.{player.level}</span></div>

                    </div>

                </div>
                <div className="text-right">

              <div className="space-y-2">
                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-green-400 font-bold">HP</span>
                    <span>{player.hp} / {stats.maxHp}</span>
                  </div>
                  <div className="w-full bg-gray-700 rounded-full h-2">
                    <div className="bg-green-500 h-2 rounded-full transition-all" style={{width: `${Math.max(0, (player.hp/stats.maxHp)*100)}%`}}></div>
                  </div>
                </div>
                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="text-blue-400 font-bold">MP</span>
                    <span>{player.mp} / {stats.maxMp}</span>
                  </div>
                  <div className="w-full bg-gray-700 rounded-full h-2">
                    <div className="bg-blue-500 h-2 rounded-full transition-all" style={{width: `${Math.max(0, stats.maxMp > 0 ? (player.mp/stats.maxMp)*100 : 0)}%`}}></div>

                </div>
              </div>
            </div>

            <div className="flex-grow p-4 space-y-4 overflow-y-auto pb-20">
              
              {player.underAttack && (
                <div className="bg-red-900/50 border border-red-500 text-red-100 p-3 rounded-lg text-center font-bold text-sm animate-pulse">

              ) : (
                <button onClick={() => startBattle('explore')} className="w-full bg-gradient-to-r from-blue-600 to-indigo-500 text-white font-bold py-5 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-1 active:scale-95 transition-transform">
                  <i className="fa-solid fa-khanda text-3xl"></i>
                  <span className="text-lg">領土を広げる (探索へ)</span>
                </button>
              )}

              <div className="grid grid-cols-2 gap-4">
                <button onClick={() => setGameState('diplomacy')} className="bg-gray-800 border border-gray-700 p-4 rounded-xl flex flex-col items-center justify-center gap-2 active:bg-gray-700">
                  <i className="fa-solid fa-handshake text-emerald-400 text-2xl"></i>

                      {!isUnlocked && <div className="text-blue-300 font-bold bg-blue-900/40 px-2 py-1 rounded text-sm border border-blue-800">{node.cost} SP</div>}
                    </div>
                    {canUnlock && <button onClick={() => unlockSkill(node)} className="w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg font-bold text-sm shadow">解放する</button>}
                    {!canUnlock && !isUnlocked && node.req.length > 0 && <p className="text-xs text-red-400 mt-2 font-bold">前提条件が未達成</p>}
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      const renderShop = () => {
        return (
          <div className="flex flex-col h-full bg-gray-900 relative">
            <div className="bg-gray-800 p-4 flex items-center justify-between border-b border-gray-700 shadow-md z-10">
              <h2 className="text-xl font-bold flex items-center gap-2"><i className="fa-solid fa-store text-green-400"></i> 商人</h2>
              <button onClick={() => setGameState('main')} className="bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold">戻る</button>
            </div>
            <div className="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center sticky top-0 z-10 shadow-sm">
              <span className="text-gray-300 font-bold">所持金</span>
              <span className="text-xl font-bold text-yellow-400"><i className="fa-solid fa-coins mr-1"></i>{player.gold} G</span>
            </div>
            <div className="flex-1 overflow-y-auto p-3 space-y-3 pb-8">
              {SHOP_ITEMS.map(item => {
                let Icon = <i className="fa-solid fa-circle text-gray-400"></i>;
                if(item.type === 'weapon') Icon = <i className="fa-solid fa-khanda text-red-400"></i>;
                if(item.type === 'armor') Icon = <i className="fa-solid fa-shield text-blue-400"></i>;
                if(item.type === 'shoes') Icon = <i className="fa-solid fa-bolt text-yellow-400"></i>;
                if(item.type === 'item') Icon = <i className="fa-solid fa-heart text-green-400"></i>;

                return (
                  <div key={item.id} className="bg-gray-800 border border-gray-700 p-3 rounded-lg flex justify-between items-center shadow">
                    <div>
                      <div className="font-bold flex items-center gap-2 text-white">{Icon} {item.name}</div>
                      <div className="text-xs text-gray-400 mt-1">{item.desc}</div>
                    </div>
                    <div className="flex flex-col items-end gap-2">
                      <span className="text-yellow-400 font-bold text-sm">{item.price} G</span>
                      <button onClick={() => buyItem(item)} disabled={player.gold < item.price} className="bg-green-600 hover:bg-green-500 disabled:bg-gray-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow">購入</button>
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-black text-white font-sans flex justify-center selection:bg-blue-500/30">
          <style dangerouslySetInnerHTML={{__html: `
            @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
            .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
            ::-webkit-scrollbar { width: 4px; }
            ::-webkit-scrollbar-track { background: #111827; }
            ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
          `}} />

          <div className="w-full max-w-md bg-gray-900 shadow-[0_0_30px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col h-screen relative mx-auto">
            
            {toastMsg && (
              <div className="absolute top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-600 text-white px-4 py-3 rounded-lg shadow-2xl z-50 text-sm w-11/12 text-center animate-fade-in font-bold flex items-center justify-center gap-2">
                <i className="fa-solid fa-circle-info text-blue-400"></i> {toastMsg}
              </div>
            )}

            {gameState === 'title' && renderTitle()}
            {gameState === 'slots_load' && renderSlots('load')}
            {gameState === 'slots_save' && renderSlots('save')}
            {gameState === 'slots_create' && renderSlots('create')}
            {gameState === 'create' && renderCreate()}
            {gameState === 'main' && renderMain()}
            {gameState === 'diplomacy' && renderDiplomacy()}
            {gameState === 'map' && renderMap()}
            {gameState === 'battle' && renderBattle()}
            {gameState === 'shop' && renderShop()}
            {gameState === 'skill' && renderSkillTree()}
            {gameState === 'inventory' && renderInventory()}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
