                  if(item.type === 'armor') Icon = <i className="fa-solid fa-shield text-blue-400"></i>;
                  if(item.type === 'shoes') Icon = <i className="fa-solid fa-bolt text-yellow-400"></i>;
                  if(item.type === 'item') Icon = <i className="fa-solid fa-heart text-green-400"></i>;
                  
                  const cost = getBuyPrice(item);

                  return (
                    <div key={item.id} className="bg-gray-800 border border-gray-700 p-3 rounded-lg flex justify-between items-center shadow">
                      <div>
                        <div className="font-bold flex items-center gap-2 text-white text-sm">{Icon} {item.name}</div>
                        <div className="text-[10px] text-gray-400 mt-1">{item.desc}</div>
                      </div>
                      <div className="flex flex-col items-end gap-2">
                        {player.job === 'merchant' ? (
                          <span className="text-green-400 font-bold text-sm">特価 {cost} G</span>
                        ) : (
                          <span className="text-yellow-400 font-bold text-sm">{cost} G</span>
                        )}
                        <button onClick={() => buyItem(item)} disabled={player.gold < cost} className="bg-green-600 hover:bg-green-500 disabled:bg-gray-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow">
                          購入
                        </button>
                      </div>
                    </div>
                  )
                })
              ) : (
                player.inventory.length === 0 ? (
                  <div className="text-center text-gray-500 my-10 text-sm">売却できる所持品がありません</div>
                ) : (
                  player.inventory.map(item => {
                    const isEquipped = Object.values(player.equipment).some(eq => eq?.uid === item.uid);
                    const sellPrice = item.sellPrice || Math.floor((item.price || item.basePrice || 20) / 2);

                    let Icon = <i className="fa-solid fa-circle text-gray-400"></i>;
                    if(item.type === 'weapon') Icon = <i className="fa-solid fa-khanda text-red-400"></i>;
                    if(item.type === 'armor') Icon = <i className="fa-solid fa-shield text-blue-400"></i>;
                    if(item.type === 'shoes') Icon = <i className="fa-solid fa-bolt text-yellow-400"></i>;
                    if(item.type === 'item') Icon = <i className="fa-solid fa-heart text-green-400"></i>;

                    return (
                      <div key={item.uid} className="bg-gray-800 border border-gray-700 p-3 rounded-lg flex justify-between items-center shadow">
                        <div>
                          <div className="font-bold flex items-center gap-1 text-white text-sm">
                            {Icon} {item.name} 
                            {item.upgradeLevel > 0 && <span className="text-orange-400 text-[10px]">+{item.upgradeLevel}</span>} 
                            {item.specialEffect && <span className="text-[9px] bg-purple-600/80 px-1 py-0.5 rounded shadow">特</span>}
                            {item.amount && <span className="text-gray-400 text-xs ml-1">x{item.amount}</span>}
                            {isEquipped && <span className="text-[10px] bg-blue-600/80 px-1.5 py-0.5 rounded text-white font-bold ml-1">装備中</span>}
                          </div>
                          <div className="text-[10px] text-gray-400 mt-1">{item.desc}</div>
                        </div>
                        <div className="flex flex-col items-end gap-2">
                          <span className="text-amber-400 font-bold text-sm">+{sellPrice} G</span>
                          <button 
                            onClick={() => sellItem(item)} 
                            disabled={isEquipped} 
                            className="bg-amber-600 hover:bg-amber-500 disabled:bg-gray-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow"
                          >
                            売却
                          </button>
                        </div>
                      </div>
                    )
                  })
                )
              )}
            </div>
          </div>
        );
      };

      const renderNightMarket = () => {
        const nightItems = getNightMarketItems();

        return (
          <div className="flex flex-col h-full bg-gray-950 relative">
            <div className="bg-purple-950/90 border-b border-purple-800 p-4 flex items-center justify-between shadow-md z-10">
              <h2 className="text-xl font-bold flex items-center gap-2 text-purple-300">
                <i className="fa-solid fa-user-ninja text-purple-400"></i> 深夜市（闇市）
              </h2>
              <button onClick={() => setGameState('main')} className="bg-purple-900 border border-purple-700 px-4 py-2 rounded-lg text-sm font-bold text-purple-200">戻る</button>
            </div>
            
            <div className="p-3 bg-purple-950/40 border-b border-purple-900/50 flex justify-between items-center text-xs text-purple-300">
              <div>営業時間: <span className="text-purple-400 font-bold">0:00 ~ 6:30</span></div>
              <div>更新: <span className="text-yellow-400 font-bold">1時間ごと</span></div>
            </div>

            <div className="p-3 bg-gray-900 border-b border-gray-800 flex justify-between items-center">
              <span className="text-gray-300 font-bold text-sm">所持金</span>
              <span className="text-xl font-bold text-yellow-400"><i className="fa-solid fa-coins mr-1"></i>{player.gold} G</span>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-3 pb-8">
              <div className="text-xs text-purple-300 bg-purple-900/30 p-2 rounded border border-purple-800/50 text-center">
                ※深夜市の商品は高価ですが、超貴重な限定アイテムが並びます。
              </div>

              {nightItems.map((item, idx) => {
                let Icon = <i className="fa-solid fa-circle text-gray-400"></i>;
                if(item.type === 'weapon') Icon = <i className="fa-solid fa-khanda text-red-400"></i>;
                if(item.type === 'armor') Icon = <i className="fa-solid fa-shield text-blue-400"></i>;
                if(item.type === 'shoes') Icon = <i className="fa-solid fa-bolt text-yellow-400"></i>;
                if(item.type === 'item') Icon = <i className="fa-solid fa-sparkles text-purple-400"></i>;

                const cost = getBuyPrice(item);

                return (
                  <div key={`${item.id}_${idx}`} className="bg-gray-900 border border-purple-900/60 p-3 rounded-lg flex justify-between items-center shadow-lg">
                    <div>
                      <div className="font-bold flex items-center gap-2 text-purple-200 text-sm">
                        {Icon} {item.name}
                      </div>
                      <div className="text-[10px] text-gray-400 mt-1">{item.desc}</div>
                    </div>
                    <div className="flex flex-col items-end gap-2">
                      {player.job === 'merchant' ? (
                          <span className="text-green-400 font-bold text-sm">特価 {cost} G</span>
                        ) : (
                          <span className="text-yellow-400 font-bold text-sm">{cost} G</span>
                        )}
                      <button 
                        onClick={() => buyItem(item)} 
                        disabled={player.gold < cost} 
                        className="bg-purple-700 hover:bg-purple-600 disabled:bg-gray-800 text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow border border-purple-500"
                      >
                        購入
                      </button>
                    </div>
                  </div>
                )
              })}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-black text-white font-sans flex justify-center selection:bg-blue-500/30">
          <div className="w-full max-w-md bg-gray-900 shadow-[0_0_30px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col h-screen relative mx-auto">
            
            {toastMsg && (
              <div className="absolute top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 border border-gray-600 text-white px-4 py-3 rounded-lg shadow-2xl z-50 text-sm w-11/12 text-center animate-fade-in font-bold flex items-center justify-center gap-2">
                <i className="fa-solid fa-circle-info text-blue-400"></i> {toastMsg}
              </div>
            )}

            {gameState === 'title' && renderTitle()}
            {gameState === 'slots_load' && renderSlots('load')}
            {gameState === 'slots_save' && renderSlots('save')}
            {gameState === 'slots_create' && renderSlots('create')}
            {gameState === 'create' && renderCreate()}
            
            {/* これ以降の画面は必ず player データが存在している時のみ描画させる（クラッシュ防止） */}
            {gameState === 'job_change' && player && renderJobChange()}
            {gameState === 'main' && player && renderMain()}
            {gameState === 'infra' && player && renderInfra()}
            {gameState === 'smith' && player && renderSmith()}
            {gameState === 'diplomacy' && player && renderDiplomacy()}
            {gameState === 'map' && player && renderMap()}
            {gameState === 'battle' && player && battle && renderBattle()}
            {gameState === 'shop' && player && renderShop()}
            {gameState === 'night_market' && player && renderNightMarket()}
            {gameState === 'skill' && player && renderSkillTree()}
            {gameState === 'inventory' && player && renderInventory()}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
