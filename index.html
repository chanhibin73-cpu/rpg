      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'attack') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
          gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'magic') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
          gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

        }
        
        if (currentPlayer.equipment) {
          ['weapon', 'armor', 'shoes'].forEach(slot => {
            const eq = currentPlayer.equipment[slot];
            if (eq) {
              let wMult = 1.0;
              const upLv = eq.upgradeLevel || 0;
              const smithSuperMult = Math.pow(2, Math.floor(upLv / 15));
              const eqAtk = eq.atk ? Math.floor((eq.atk * Math.pow(1.1, upLv) + upLv*2) * smithSuperMult) : 0;
              const eqDef = eq.def ? Math.floor((eq.def * Math.pow(1.1, upLv) + upLv*2) * smithSuperMult) : 0;
              const eqMAtk = eq.mAtk ? Math.floor((eq.mAtk * Math.pow(1.1, upLv) + upLv*2) * smithSuperMult) : 0;
              const eqMDef = eq.mDef ? Math.floor((eq.mDef * Math.pow(1.1, upLv) + upLv*2) * smithSuperMult) : 0;
              const eqAgi = (eq.agi || 0) * smithSuperMult; 
              
              const specMult = eq.specialEffect ? 1.3 : 1.0;

              if (slot === 'weapon') {
                if (currentPlayer.job === 'swordsman' && eq.weaponType === 'sword') wMult = 1.5;
                if (currentPlayer.job === 'warrior' && eq.weaponType === 'axe') wMult = 1.5;
                if (currentPlayer.job === 'mage' && (eq.weaponType === 'wand' || eq.weaponType === 'magic_tool')) wMult = 1.5;
                if (currentPlayer.job === 'merchant' && (eq.weaponType === 'dagger' || eq.weaponType === 'magic_tool')) wMult = 1.5;
              }
              stats.atk += Math.floor(eqAtk * wMult * specMult);
              stats.def += Math.floor(eqDef * wMult * specMult);
              stats.mAtk += Math.floor(eqMAtk * wMult * specMult);
              stats.mDef += Math.floor(eqMDef * wMult * specMult);
              stats.agi += Math.floor(eqAgi * wMult * specMult);
            }
          });
        }

        stats.maxHp = Math.max(1, Math.floor(stats.maxHp * mults.maxHp));
        stats.maxMp = Math.max(0, Math.floor(stats.maxMp * mults.maxMp));
        stats.atk = Math.max(1, Math.floor(stats.atk * mults.atk));
        stats.def = Math.max(1, Math.floor(stats.def * mults.def));
        stats.mAtk = Math.max(1, Math.floor(stats.mAtk * mults.mAtk));
        stats.mDef = Math.max(1, Math.floor(stats.mDef * mults.mDef));
        stats.agi = Math.max(1, Math.floor(stats.agi * mults.agi));
        stats.luk = Math.max(1, Math.floor(stats.luk * mults.luk));

        return stats;
      };

      const checkInvasion = (currentPlayer) => {
        let updatedPlayer = { ...currentPlayer };
        if (updatedPlayer.territory > 0 && !updatedPlayer.underAttack && updatedPlayer.level >= 5) {
          let invasionChance = 11;
          if (updatedPlayer.infra?.fort) invasionChance -= 4;
          if (randomInt(1, 100) <= invasionChance) {
            updatedPlayer.underAttack = true;
          }
        }
        return updatedPlayer;
      };

      const getInitialEquipment = (jobKey) => {
      const config = JOB_INITIAL_EQUIPMENT[jobKey] || JOB_INITIAL_EQUIPMENT.neet;
      const allShopItems = [...SHOP_ITEMS_MORNING, ...SHOP_ITEMS_AFTERNOON];
      const findItem = (id) => {
        if (INITIAL_ITEMS.weapon.id === id) return INITIAL_ITEMS.weapon;
        if (INITIAL_ITEMS.armor.id === id) return INITIAL_ITEMS.armor;
        if (INITIAL_ITEMS.shoes.id === id) return INITIAL_ITEMS.shoes;
        return allShopItems.find(i => i.id === id) || INITIAL_ITEMS.weapon;
      };
      return {
        weapon: { ...findItem(config.weapon), uid: generateId() },
        armor: { ...findItem(config.armor), uid: generateId() },
        shoes: { ...findItem(config.shoes), uid: generateId() }
      };
    };

    const initGame = () => {
        if (!createData.name.trim()) return showToast('名前を入力してください');

        const jobKey = createData.job;
        const base = JOB_BASE_STATS[jobKey];
        const baseStats = { 
          maxHp: base.maxHp + randomInt(-5, 10), maxMp: base.maxMp + randomInt(0, 5), 
          atk: base.atk + randomInt(-2, 3), def: base.def + randomInt(-2, 3), 
          mAtk: base.mAtk + randomInt(-2, 3), mDef: base.mDef + randomInt(-2, 3),
          agi: base.agi + randomInt(-2, 3), luk: base.luk + randomInt(0, 3) 
        };

        const initialEquipment = getInitialEquipment(jobKey);
        const w = initialEquipment.weapon;
        const a = initialEquipment.armor;
        const s = initialEquipment.shoes;

        const personalSkills = getRandomElements(RANDOM_SKILLS_POOL, 2);

        let initialSkills = [];
        if (jobKey === 'swordsman') initialSkills = ['heavy_strike', 'heal_light'];
        if (jobKey === 'warrior') initialSkills = ['warrior_def_up'];
        if (jobKey === 'mage') initialSkills = ['fireball', 'heal_light'];
        if (jobKey === 'merchant') initialSkills = ['merchant_fire', 'buff_atk'];
        if (jobKey === 'neet') initialSkills = ['neet_agi_up', 'debuff_agi'];

        const newPlayerData = {
          name: createData.name, avatar: createData.avatar, 
          difficulty: createData.difficulty, job: jobKey,
          level: 1, exp: 0, gold: 1000, sp: 10, territory: 1,
          baseStats, hp: baseStats.maxHp, mp: baseStats.maxMp, equipment: { weapon: w, armor: a, shoes: s },
          inventory: [w, a, s], skills: initialSkills, unlockedNodes: [], personalSkillTree: personalSkills,
          infra: { road: false, bridge: false, fort: false },
          underAttack: false, nations: JSON.parse(JSON.stringify(INITIAL_NATIONS)), 
          lastSave: null, lastTradeTime: Date.now(), expBoostUntil: 0
        };

        const initialStats = getStats(newPlayerData);
        newPlayerData.hp = initialStats.maxHp;
        newPlayerData.mp = initialStats.maxMp;

        const savedData = persistSave(currentSlot, newPlayerData);
        setPlayer(savedData);
        setGameState('main');
        showToast(`スロット${currentSlot}で開始＆セーブしました！`);
      };

      const executeJobChange = (newJob) => {
        let newPlayer = { ...player };
        newPlayer.level = 1;
        newPlayer.exp = 0;
        newPlayer.job = newJob;
        
        newPlayer.baseStats.maxHp = Math.max(1, Math.floor(newPlayer.baseStats.maxHp / 2));
        newPlayer.baseStats.atk = Math.max(1, Math.floor(newPlayer.baseStats.atk / 2));
        newPlayer.baseStats.def = Math.max(1, Math.floor(newPlayer.baseStats.def / 2));
        newPlayer.baseStats.mAtk = Math.max(1, Math.floor(newPlayer.baseStats.mAtk / 2));
        newPlayer.baseStats.mDef = Math.max(1, Math.floor(newPlayer.baseStats.mDef / 2));
        newPlayer.baseStats.agi = Math.max(1, Math.floor(newPlayer.baseStats.agi / 2));
        newPlayer.baseStats.luk = Math.max(1, Math.floor(newPlayer.baseStats.luk / 2));
        
        const newStats = getStats(newPlayer);
        newPlayer.hp = Math.min(newPlayer.hp, newStats.maxHp);
        newPlayer.mp = Math.min(newPlayer.mp, newStats.maxMp);
        
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`「${JOBS[newJob].name}」にジョブチェンジしました！`);
        setGameState('main');
      };

      const saveGameToSlot = (slotNum) => {
        if (!player) return;
        const savedData = persistSave(slotNum, player);
        setPlayer(savedData);
        setCurrentSlot(slotNum);
        showToast(`スロット${slotNum}にセーブしました`);
        setGameState('main');
      };

      const loadGameFromSlot = (slotNum) => {
        const data = StorageManager.getItem(getSaveKey(slotNum));
        if (data) { 
          try {
            const parsed = JSON.parse(data);
            if (!parsed.nations) parsed.nations = JSON.parse(JSON.stringify(INITIAL_NATIONS));
            if (!parsed.personalSkillTree) parsed.personalSkillTree = [];
            if (!parsed.unlockedNodes) parsed.unlockedNodes = [];
            if (!parsed.skills) parsed.skills = [];
            if (!parsed.equipment) parsed.equipment = { weapon: null, armor: null, shoes: null };
            if (!parsed.inventory) parsed.inventory = [];
            if (!parsed.infra) parsed.infra = { road: false, bridge: false, fort: false };
            if (!parsed.difficulty) parsed.difficulty = 'normal';
            if (!parsed.job) parsed.job = 'swordsman';
            if (!parsed.baseStats) parsed.baseStats = JOB_BASE_STATS[parsed.job] || { maxHp: 10, maxMp: 0, atk: 1, def: 1, mAtk: 1, mDef: 1, agi: 1, luk: 1 };
            if (parsed.baseStats.mAtk === undefined) {
               parsed.baseStats.mAtk = JOB_BASE_STATS[parsed.job]?.mAtk || 5;
               parsed.baseStats.mDef = JOB_BASE_STATS[parsed.job]?.mDef || 5;
            }
            if (!parsed.lastTradeTime) parsed.lastTradeTime = Date.now();
            
            setPlayer(parsed); 
            setCurrentSlot(slotNum);
            setGameState('main'); 
            showToast(`スロット${slotNum}をロードしました`); 
          } catch(e) {
            showToast('データのロードに失敗しました');
          }
        } else {
          showToast('セーブデータがありません');
        }
      };

      const getSaveDataInfo = (slotNum) => {
        const data = StorageManager.getItem(getSaveKey(slotNum));
        if (data) {
          try {
            const parsed = JSON.parse(data);
            let diff = parsed.difficulty || 'normal';
            return { 
              exists: true, 
              name: parsed.name, 
              level: parsed.level, 
              territory: parsed.territory, 
              time: parsed.lastSave,
              difficulty: diff,
              job: parsed.job || 'swordsman'
            };
          } catch(e) {}
        }
        return { exists: false };
      };

      const getBuyPrice = (item) => {
        let price = item.price || item.basePrice || 50;
        if (player.job === 'merchant') price = Math.floor(price * 0.8);
        return price;
      };

      const buyItem = (item) => {
        const cost = getBuyPrice(item);
        if (player.gold < cost) return showToast('ゴールドが足りません');
        let newInventory = player.inventory.map(i => ({...i}));
        
        if (item.type === 'item') {
          const existing = newInventory.find(i => i.id === item.id);
          if (existing) {
            if (existing.amount >= 99) return showToast('これ以上持てません');
            existing.amount += 1;
          }
          else newInventory.push({ ...item, uid: generateId(), amount: 1 });
        } else {
          newInventory.push({ ...item, uid: generateId(), upgradeLevel: 0 });
        }
        
        const newPlayer = { ...player, gold: player.gold - cost, inventory: newInventory };
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${item.name}を購入しました`);
      };

      const sellItem = (item) => {
        const isEquipped = Object.values(player.equipment).some(eq => eq?.uid === item.uid);
        if (isEquipped) return showToast('装備中のアイテムは売却できません');

        const sellPrice = item.sellPrice || Math.floor((item.price || item.basePrice || 20) / 2);
        let newInventory = player.inventory.map(i => ({...i}));

        if (item.type === 'item') {
          const idx = newInventory.findIndex(i => i.uid === item.uid);
          if (idx !== -1) {
            if (newInventory[idx].amount > 1) {
              newInventory[idx].amount -= 1;
            } else {
              newInventory.splice(idx, 1);
            }
          }
        } else {
          const idx = newInventory.findIndex(i => i.uid === item.uid);
          if (idx !== -1) {
            newInventory.splice(idx, 1);
          }
        }

        const newPlayer = { ...player, gold: player.gold + sellPrice, inventory: newInventory };
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${item.name}を ${sellPrice}G で売却しました`);
      };

      const buildInfra = (infraKey) => {
        const targetInfra = INFRA_OPTIONS[infraKey];
        if (player.gold < targetInfra.cost) return showToast('ゴールドが足りません');
        if (player.infra?.[infraKey]) return showToast('すでに整備・建設済みです');

        let newPlayer = { ...player, gold: player.gold - targetInfra.cost };
        newPlayer.infra[infraKey] = true;
        
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`【整備完了】${targetInfra.name} を完了しました！`);
      };

      const handleAlliance = (nationId) => {
        const nation = player.nations[nationId];
        if (player.gold < nation.allianceCost) return showToast('ゴールドが足りません');
        
        let newPlayer = { ...player, gold: player.gold - nation.allianceCost };
        newPlayer.nations[nationId].relation = 'allied';
        
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${nation.name}と同盟を締結しました！`);
      };

      const upgradeEquipment = (item) => {
        const isEquippedSlot = Object.keys(player.equipment).find(slot => player.equipment[slot]?.uid === item.uid);
        const upLv = item.upgradeLevel || 0;
        if (upLv < 0) return showToast('強化値が不正です');

        const baseVal = item.price || 300;
        const cost = Math.floor(baseVal * (upLv + 1) * 0.5);

        if (player.gold < cost) return showToast('ゴールドが足りません');

        let newItem = { ...item, upgradeLevel: upLv + 1 };
        let newPlayer = { ...player, gold: player.gold - cost };

        if (isEquippedSlot) {
          newPlayer.equipment[isEquippedSlot] = newItem;
          const idx = newPlayer.inventory.findIndex(i => i.uid === item.uid);
          if (idx !== -1) newPlayer.inventory[idx] = newItem;
        } else {
          const idx = newPlayer.inventory.findIndex(i => i.uid === item.uid);
          if (idx !== -1) newPlayer.inventory[idx] = newItem;
        }

        playSound('magic');
        setPlayer(newPlayer);
        persistSave(currentSlot, newPlayer);
        showToast(`${item.name} が +${newItem.upgradeLevel} に強化されました！`);
      };

      const startBattle = (type = 'explore', targetNationId = null, direction = null) => {
        const isDefense = type === 'defense';
        const isInvasion = type === 'invasion';
        const dirData = direction ? EXPLORE_DIRECTIONS[direction] : null;
        
        let targetMapIdx = player.territory;
        let targetCoord = MAP_COORDS[targetMapIdx];
        if (!targetCoord) targetCoord = MAP_COORDS[MAP_COORDS.length - 1];
        let dist = Math.max(Math.abs(targetCoord.x), Math.abs(targetCoord.y));
        if (direction === 'inside') dist = 0;

        let baseEnemyLevel = player.level + randomInt(0, 3) + Math.floor(dist * 1.5);
        if (direction === 'inside') {
          baseEnemyLevel = Math.min(10, player.level + randomInt(0, 3));
        }
        let terriLevel = Math.max(1, Math.min(100, baseEnemyLevel));

        if (isInvasion) {
          terriLevel = Math.floor(player.nations[targetNationId].power / 2);
        }

        const maxEnemies = Math.min(3, Math.ceil(terriLevel / 5) + 1);
        const enemyCount = randomInt(isDefense || isInvasion ? 2 : 1, maxEnemies);
        
        const generatedEnemies = [];
        const nameCounts = {};
        const isMidBossEncounter = !isInvasion && player.level >= 30 && player.level <= 50 && Math.random() < 0.01;
        
        const diffData = DIFFICULTY_SETTINGS[player.difficulty || 'normal'];
        const hardMult = diffData.statMult;
        const hardRewardMult = diffData.rewardMult;

        for(let i=0; i<enemyCount; i++) {
          let enemyLevel = isMidBossEncounter && i === 0 ? 40 : terriLevel + randomInt(0, 3);
          
          enemyLevel = Math.max(player.level, enemyLevel);
          
          if (direction === 'inside') {
            enemyLevel = Math.min(10, enemyLevel);
          }
          
          enemyLevel = Math.max(1, Math.min(100, enemyLevel));
          
          let baseName = ENEMY_NAMES[randomInt(0, ENEMY_NAMES.length - 1)];
          // 中ボス：プレイヤーLv30～50、出現率1%
          const isMidBoss = isMidBossEncounter && i === 0;
          // 通常探索時、1.5%の確率ではがねスライムが出現
          const isSteelSlime = !isMidBoss && !isInvasion && Math.random() < 0.015;
          if (isMidBoss) baseName = MID_BOSS_NAME;
          else if (isSteelSlime) baseName = RARE_ENEMY_STEEL_SLIME;
          if (isInvasion) baseName = `${player.nations[targetNationId].name}兵`;
          
          nameCounts[baseName] = (nameCounts[baseName] || 0) + 1;

          let statMultiplier = (enemyCount > 1 ? 0.8 : 1.0) * (isDefense ? 1.2 : 1.0);
          if (isInvasion) statMultiplier *= 5.0; 
          // ウルフを弱体化
          const enemyTypeMult = baseName === 'ウルフ' ? 0.7 : 1.0;
          // 敵全体の攻撃力を20%アップ
          const enemyAttackMult = 1.2;
          // はがねスライム：HP3～10固定、MP・速度4倍、防御16倍
          const steelSlimeHpMult = baseName === RARE_ENEMY_STEEL_SLIME ? 0.25 : 1.0;
          const steelSlimeStatMult = baseName === RARE_ENEMY_STEEL_SLIME ? 4.0 : 1.0;
          const steelSlimeDefMult = baseName === RARE_ENEMY_STEEL_SLIME ? 128.0 : 1.0;
          
          const hpMult = statMultiplier * enemyTypeMult * (dirData ? dirData.statMult.hp : 1.0);
          const atkMult = statMultiplier * enemyTypeMult * enemyAttackMult * (dirData ? dirData.statMult.atk : 1.0);
          const defMult = statMultiplier * enemyTypeMult * (dirData ? dirData.statMult.def : 1.0);
          const mAtkMult = statMultiplier * enemyTypeMult * (dirData ? (dirData.statMult.mAtk || 1.0) : 1.0);
          const agiMult = enemyTypeMult * (dirData ? dirData.statMult.agi : 1.0);
          
          const expBonus = statMultiplier * (dirData ? dirData.expMult : 1.0) * hardRewardMult;
          const goldBonus = statMultiplier * (dirData ? dirData.goldMult : 1.0) * hardRewardMult;

          let lowLevelNerf = 1.0;
          if (enemyLevel <= 10) {
            lowLevelNerf = 0.2;
          } else if (enemyLevel <= 20) {
            lowLevelNerf = 0.2 + 0.8 * ((enemyLevel - 10) / 10);
          }

          let hpHighLevelBonus = 1.0;
          let atkHighLevelNerf = 1.0;
          if (enemyLevel > 70) {
            hpHighLevelBonus = 2.0; 
            atkHighLevelNerf = 0.7; 
          }

          const baseHp = randomInt(40 + enemyLevel * 15, 70 + enemyLevel * 25) * lowLevelNerf * hpHighLevelBonus;
          const baseAtk = randomInt(12 + enemyLevel * 3, 20 + enemyLevel * 6) * lowLevelNerf * atkHighLevelNerf * 0.75; 
          const baseDef = randomInt(6 + enemyLevel * 3, 12 + enemyLevel * 5) * lowLevelNerf;
          const baseMAtk = randomInt(10 + enemyLevel * 3, 18 + enemyLevel * 6) * lowLevelNerf * atkHighLevelNerf * 0.75; 
          const baseMDef = randomInt(6 + enemyLevel * 3, 12 + enemyLevel * 5) * lowLevelNerf;
          const baseAgi = randomInt(5 + enemyLevel * 2, 10 + enemyLevel * 3) * lowLevelNerf;

          const maxHp = baseName === MID_BOSS_NAME ? randomInt(2500, 3500) : (baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(3, 10) : Math.max(1, Math.floor(baseHp * hpMult * steelSlimeHpMult * hardMult)));
          
          let enemySkills = baseName === MID_BOSS_NAME ? ['double_slash', 'fireball', 'heal_light'] : (enemyLevel >= 5 ? [...(ENEMY_SKILL_POOLS[baseName] || ['fireball'])] : []);

          generatedEnemies.push({
            id: generateId(),
            baseName,
            level: enemyLevel,
            maxHp, hp: maxHp,
            atk: Math.max(1, Math.floor((baseName === MID_BOSS_NAME ? 80 + enemyLevel * 3 : baseAtk) * atkMult * hardMult)),
            def: Math.max(1, Math.floor((baseName === MID_BOSS_NAME ? 60 + enemyLevel * 3 : baseDef) * defMult * steelSlimeDefMult * hardMult)),
            mAtk: Math.max(1, Math.floor((baseName === MID_BOSS_NAME ? 70 + enemyLevel * 3 : baseMAtk) * mAtkMult * hardMult)),
            mDef: Math.max(1, Math.floor((baseName === MID_BOSS_NAME ? 60 + enemyLevel * 2 : baseMDef) * defMult * hardMult)),
            agi: Math.max(1, Math.floor((baseName === MID_BOSS_NAME ? 40 : baseAgi) * agiMult * steelSlimeStatMult * hardMult)),
            maxMp: Math.max(1, Math.floor(enemyLevel * 2 * steelSlimeStatMult)),
            mp: Math.max(1, Math.floor(enemyLevel * 2 * steelSlimeStatMult)),
            exp: Math.floor((20 + enemyLevel * 10 + enemyLevel * enemyLevel) * expBonus * (baseName === RARE_ENEMY_STEEL_SLIME ? 8 : 1)),
            gold: Math.floor((40 + enemyLevel * 15) * goldBonus * (baseName === RARE_ENEMY_STEEL_SLIME ? 8 : 1)),
            buffs: { atk: 0, def: 0, agi: 0, stun: 0 },
            skills: enemySkills,
            escaped: false,
            fleeAfterTurns: baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(5, 9) : null,
            fleeTurnCount: 0
          });
        }

        const nameCurrent = {};
        generatedEnemies.forEach(e => {
          if (nameCounts[e.baseName] > 1) {
            nameCurrent[e.baseName] = (nameCurrent[e.baseName] || 0) + 1;
            e.name = `${e.baseName}${String.fromCharCode(64 + nameCurrent[e.baseName])}`;
          } else {
            e.name = e.baseName;
          }
        });

        let allyHelp = null;
        if (isDefense) {
          const alliedNations = Object.values(player.nations).filter(n => n.relation === 'allied' && !n.isDestroyed);
          if (alliedNations.length > 0) allyHelp = alliedNations[randomInt(0, alliedNations.length - 1)];
        }

        const initialLogs = [];
        if (player.difficulty === 'hard') initialLogs.push(`【HARD MODE】敵が通常より強力だ...！`);
        if (player.difficulty === 'very_hard') initialLogs.push(`【VERY HARD MODE】敵が絶望的に強力だ...！`);
        
        if (isDefense) {
          initialLogs.push(`敵軍が領土に攻め込んできた！防衛せよ！`);
          if (player.infra?.fort) initialLogs.push(`防衛砦の効果発動！(全味方能力+20%)`);
          if (allyHelp) initialLogs.push(`同盟国【${allyHelp.name}】の援軍が駆けつけた！(全味方能力+25%)`);
        } else if (isInvasion) {
          initialLogs.push(`【${player.nations[targetNationId].name}】へ侵攻を開始！`);
          initialLogs.push(`凄まじい強さの敵兵が立ちはだかる…！(敵戦力5倍)`);
        } else if (direction === 'inside') {
          initialLogs.push(`自国領土内の安全なパトロールを開始！`);
          initialLogs.push(`敵が現れた！`);
        } else if (direction) {
          initialLogs.push(`【${dirData.name}】の方向へ探索を開始！`);
          initialLogs.push(`敵が現れた！`);
        } else {
          initialLogs.push(`敵が現れた！`);
        }

        setBattle({
          isDefense, isInvasion, targetNationId, direction, allyHelp,
          enemies: generatedEnemies, logs: initialLogs, isOver: false,
          selectedTargetId: generatedEnemies[0].id,
          playerBuffs: { atk: 0, def: 0, agi: 0, stun: 0, autoHealTurns: 0, autoHealPercent: 0 },
          turnCount: 0
        });
        setGameState('battle');
      };

      const processTurn = (actionType, skillData = null) => {
        if (!battle || battle.isOver) return;

        let newPlayer = { ...player };
        let newEnemies = battle.enemies.map(e => ({...e, buffs: {...e.buffs}}));
        let logs = [...battle.logs];
        let stats = getStats(newPlayer);
        let battlePlayerBuffs = battle.playerBuffs ? { ...battle.playerBuffs } : { atk: 0, def: 0, agi: 0, stun: 0, autoHealTurns: 0, autoHealPercent: 0 };

        let buffMultiplier = 1.0;
        if (battle.allyHelp) buffMultiplier += 0.25;
        if (battle.isDefense && newPlayer.infra?.fort) buffMultiplier += 0.20;

        stats.atk = Math.floor(stats.atk * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.atk))));
        stats.def = Math.floor(stats.def * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.def))));
        stats.mAtk = Math.floor(stats.mAtk * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.atk))));
        stats.mDef = Math.floor(stats.mDef * buffMultiplier * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.def))));
        stats.agi = Math.floor(stats.agi * (1 + Math.max(-0.5, Math.min(1.0, battlePlayerBuffs.agi))));

        const addLog = (msg) => logs.push(msg);
        let targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);

        const actors = [
          { isPlayer: true, agi: stats.agi },
          ...newEnemies.filter(e => e.hp > 0).map(e => {
            let eAgi = Math.floor(e.agi * (1 + Math.max(-0.5, Math.min(1.0, e.buffs.agi))));
            return { isPlayer: false, id: e.id, agi: eAgi };
          })
        ].sort((a, b) => b.agi - a.agi);

        // ダメージ計算：{(攻撃力×バフ・デバフ補正) - (防御力×バフ・デバフ補正÷2)}×技倍率
        const calculateDamage = (atkVal, defVal, lukVal, multiplier = 1, atkBuff = 0, defBuff = 0) => {
          const safeLuk = lukVal || 10;
          const critChance = Math.min(50, safeLuk * 1.5);
          const isCrit = randomInt(1, 100) <= critChance;
          const safeAtkBuff = Math.max(-0.5, Math.min(1.0, atkBuff || 0));
          const safeDefBuff = Math.max(-0.5, Math.min(1.0, defBuff || 0));
          const effectiveAtk = atkVal * (1 + safeAtkBuff);
          const effectiveDef = defVal * (1 + safeDefBuff);
          let dmg = Math.max(1, Math.floor((effectiveAtk - (effectiveDef / 2)) * multiplier));
          if (isCrit) dmg = Math.floor(dmg * 2);
          return { dmg, isCrit };
        };

        let fled = false;

        for (let actor of actors) {
          if (newPlayer.hp <= 0) break;
          if (newEnemies.every(e => e.hp <= 0)) break;

          if (actor.isPlayer) {
            
            if (battlePlayerBuffs.stun > 0) {
              battlePlayerBuffs.stun -= 1;
              addLog(`あなたは行動不能だ！`);
              continue;
            }

            if (actionType === 'flee') {
              if (battle.isDefense) {
                addLog('防衛戦からは逃げられない！領土を見捨てることになる！');
                fled = true; break;
              } else {
                const avgAgi = newEnemies.reduce((sum, e) => sum + e.agi, 0) / newEnemies.length;
                if (randomInt(1, 100) <= 50 + stats.agi - avgAgi) {
                  addLog('逃げ出すことに成功した！');
                  fled = true; break;
                } else {
                  addLog('逃げられなかった！');
                }
              }
            } 
            else if (actionType === 'attack') {
              if (newPlayer.job === 'mage') {
                addLog(`魔道士は物理攻撃ができない！`);
              } else {
                playSound('attack');
                triggerShake();
                targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                if (!targetEnemy) continue;
                const { dmg: calculatedDmg, isCrit } = calculateDamage(stats.atk, targetEnemy.def, stats.luk, 1, 0, targetEnemy.buffs.def);
                const dmg = targetEnemy.baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(1, 2) : calculatedDmg;
                targetEnemy.hp -= dmg;
                addLog(`あなたの攻撃！ ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
              }
            } 
            else if (actionType === 'skill' && skillData) {
              let actMpCost = skillData.mpCost || 0;
              // 魔法攻撃は倍率に応じてMP消費を算出（1倍につき4MP・切り捨て）
              if (skillData.type === 'magic' && typeof skillData.multiplier === 'number') {
                actMpCost = Math.floor(skillData.multiplier * 4);
              }
              // 魔道士は消費MP半減（切り捨て・最低1MP）
              if (newPlayer.job === 'mage' && actMpCost > 0) actMpCost = Math.max(1, Math.floor(actMpCost / 2));

              if (newPlayer.mp < actMpCost) {
                addLog(`MPが足りない！`);
              } else {
                newPlayer.mp -= actMpCost;
                playSound('magic');
                triggerShake();
                
                if (skillData.type === 'stun') {
                  targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                  if (!targetEnemy) continue;
                  let stunTurns = 1;
                  if (randomInt(1, 3) === 1) stunTurns = 2; 
                  targetEnemy.buffs.stun = (targetEnemy.buffs.stun || 0) + stunTurns;
                  addLog(`【${skillData.name}】${targetEnemy.name}の時を止めた！(${stunTurns}ターン)`);
                }
                else if (skillData.type === 'buff_dynamic') {
                  let baseVal = 0.2;
                  let bonus = Math.floor(newPlayer.level / 5) * 0.05;
                  battlePlayerBuffs[skillData.stat] += (baseVal + bonus);
                  addLog(`【${skillData.name}】あなたの${STAT_NAMES[skillData.stat]}が大幅に上昇した！`);
                }
                else if (skillData.type === 'buff') {
                  battlePlayerBuffs[skillData.stat] += skillData.val;
                  addLog(`【${skillData.name}】あなたの${STAT_NAMES[skillData.stat]}が変化した！`);
                } else if (skillData.type === 'debuff') {
                  targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                  if (!targetEnemy) continue;
                  targetEnemy.buffs[skillData.stat] += skillData.val;
                  addLog(`【${skillData.name}】${targetEnemy.name}の${STAT_NAMES[skillData.stat]}が低下した！`);
                } else if (skillData.target === 'all') {
                  addLog(`${skillData.name}！`);
                  newEnemies.filter(e => e.hp > 0).forEach(e => {
                    const isMagic = skillData.type === 'magic';
                    let tDef = isMagic ? e.mDef : e.def;
                    let myAtk = isMagic ? stats.mAtk : stats.atk;

                    const { dmg: calculatedDmg, isCrit } = calculateDamage(myAtk, tDef, stats.luk, skillData.multiplier, 0, e.buffs.def);
                    const dmg = e.baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(1, 2) : calculatedDmg;
                    e.hp -= dmg;
                    addLog(` -> ${e.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                  });
                } else if (skillData.type === 'heal') {
                  const healAmount = Math.max(1, Math.floor(stats.maxHp * ((skillData.healPercent || 0) / 100)));
                  newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + healAmount);
                  addLog(`${skillData.name}！ HPが${healAmount}回復した！`);
                } else if (skillData.type === 'auto_heal') {
                  battlePlayerBuffs.autoHealTurns = skillData.turns || 5;
                  battlePlayerBuffs.autoHealPercent = skillData.healPercent || 10;
                  addLog(`${skillData.name}！ 5ターンの自動回復を開始した！`);
                } else {
                  targetEnemy = newEnemies.find(e => e.id === battle.selectedTargetId && e.hp > 0) || newEnemies.find(e => e.hp > 0);
                  if (!targetEnemy) continue;
                  const isMagic = skillData.type === 'magic';
                  let tDef = isMagic ? targetEnemy.mDef : targetEnemy.def;
                  let myAtk = isMagic ? stats.mAtk : stats.atk;
                  
                  if (skillData.type === 'attack_multi') {
                    addLog(`${skillData.name}！`);
                    for (let i = 0; i < (skillData.hits || 1); i++) {
                      if (targetEnemy.hp <= 0) break;
                      const { dmg: calculatedDmg, isCrit } = calculateDamage(myAtk, tDef, stats.luk, skillData.multiplier, 0, targetEnemy.buffs.def);
                      const dmg = targetEnemy.baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(1, 2) : calculatedDmg;
                      targetEnemy.hp -= dmg;
                      addLog(` -> ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                    }
                  } else {
                    const { dmg: calculatedDmg, isCrit } = calculateDamage(myAtk, tDef, stats.luk, skillData.multiplier, 0, targetEnemy.buffs.def);
                    const dmg = targetEnemy.baseName === RARE_ENEMY_STEEL_SLIME ? randomInt(1, 2) : calculatedDmg;
                    targetEnemy.hp -= dmg;
                    addLog(`${skillData.name}！ ${targetEnemy.name}に${dmg}ダメージ！${isCrit ? '(会心!)' : ''}`);
                  }
                }
              }
            } 
          } else {
            const enemy = newEnemies.find(e => e.id === actor.id);
            if (enemy && enemy.hp > 0) {
              
              if (enemy.buffs.stun && enemy.buffs.stun > 0) {
                enemy.buffs.stun -= 1;
                addLog(`${enemy.name}は時を止められている！行動不能！`);
                continue;
              }

              const enemyLuk = Math.min(20, enemy.level * 2);
              let eAtk = Math.floor(enemy.atk * (1 + Math.max(-0.5, Math.min(1.0, enemy.buffs.atk))));
              let eMAtk = Math.floor(enemy.mAtk || enemy.atk);
              let eDef = Math.floor(enemy.def * (1 + Math.max(-0.5, Math.min(1.0, enemy.buffs.def))));

              let usedSkill = null;
              if (enemy.skills && enemy.skills.length > 0 && randomInt(1, 100) <= 25) { 
                let availableEnemySkills = [...enemy.skills];
                if (enemy.baseName === MID_BOSS_NAME && enemy.hp >= enemy.maxHp) availableEnemySkills = availableEnemySkills.filter(id => id !== 'heal_light');
                if (availableEnemySkills.length > 0) {
                  const randomSkillId = availableEnemySkills[randomInt(0, availableEnemySkills.length - 1)];
                  usedSkill = SKILLS_DATA[randomSkillId];
                }
              }

              if (usedSkill) {
                playSound('magic');
                triggerShake();
                let eMult = usedSkill.multiplier || 1;
                if (enemy.baseName === MID_BOSS_NAME && usedSkill.name === '二段斬り') eMult *= 0.5;
                if (usedSkill.type === 'magic') eMult *= 0.2;

                if (usedSkill.type === 'attack' || usedSkill.type === 'magic') {
                  const isMagic = usedSkill.type === 'magic';
                  let defToUse = isMagic ? stats.mDef : stats.def;
                  let atkToUse = isMagic ? eMAtk : eAtk;
                  
                  if (usedSkill.target === 'all') {
                     const { dmg, isCrit } = calculateDamage(atkToUse, defToUse, enemyLuk, eMult, enemy.buffs.atk, battlePlayerBuffs.def);
                     newPlayer.hp -= dmg;
                     addLog(`${enemy.name}の${usedSkill.name}！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
                  } else {
                     const { dmg, isCrit } = calculateDamage(atkToUse, defToUse, enemyLuk, eMult, enemy.buffs.atk, battlePlayerBuffs.def);
                     newPlayer.hp -= dmg;
                     addLog(`${enemy.name}の${usedSkill.name}！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
                  }
                } else if (usedSkill.type === 'attack_multi') {
                  addLog(`${enemy.name}の${usedSkill.name}！`);
                  for (let i = 0; i < (usedSkill.hits || 1); i++) {
                    if (newPlayer.hp <= 0) break;
                    const { dmg, isCrit } = calculateDamage(eAtk, stats.def, enemyLuk, usedSkill.multiplier, enemy.buffs.atk, battlePlayerBuffs.def);
                    newPlayer.hp -= dmg;
                    addLog(` -> あなたに${dmg}ダメージ！${isCrit ? '(痛恨!)' : ''}`);
                  }
                } else if (usedSkill.type === 'heal') {
                   const enemyHealAmount = Math.max(1, Math.floor(enemy.maxHp * ((usedSkill.healPercent || 0) / 100)));
                   enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemyHealAmount);
                   addLog(`${enemy.name}は${usedSkill.name}を使い、HPが${enemyHealAmount}回復した！`);
                } else if (usedSkill.type === 'buff') {
                   enemy.buffs[usedSkill.stat] += usedSkill.val;
                   addLog(`${enemy.name}は${usedSkill.name}を使った！ 自身の能力が上昇！`);
                } else if (usedSkill.type === 'debuff') {
                   battlePlayerBuffs[usedSkill.stat] += usedSkill.val;
                   addLog(`${enemy.name}の${usedSkill.name}！ あなたの${STAT_NAMES[usedSkill.stat]}が低下！`);
                }
              } else {
                playSound('damage');
                triggerShake();
                const { dmg, isCrit } = calculateDamage(eAtk, stats.def, enemyLuk, 1, enemy.buffs.atk, battlePlayerBuffs.def);
                newPlayer.hp -= dmg;
                addLog(`${enemy.name}の攻撃！ あなたは${dmg}ダメージを受けた！${isCrit ? '(痛恨!)' : ''}`);
              }
            }
          }
        } 

        // はがねスライムは5～9回、自身が行動できたターン後に逃走
        // 時間停止（stun）中のターンは逃走カウントに含めない
        newEnemies.forEach(e => {
          if (e.baseName === RARE_ENEMY_STEEL_SLIME && !e.escaped && e.hp > 0 && e.fleeAfterTurns) {
            const wasStunned = (e.buffs.stun || 0) > 0;
            if (!wasStunned) e.fleeTurnCount = (e.fleeTurnCount || 0) + 1;
            if (e.fleeTurnCount >= e.fleeAfterTurns) {
              e.escaped = true;
              e.hp = 0;
              addLog(`【逃走】${e.name}は逃げ出した！`);
            }
          }
        });
        const currentTurn = (battle.turnCount || 0) + 1;

        if (newPlayer.hp > 0 && battlePlayerBuffs.autoHealTurns > 0) {
          const autoHealAmount = Math.max(1, Math.floor(stats.maxHp * ((battlePlayerBuffs.autoHealPercent || 10) / 100)));
          newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + autoHealAmount);
          battlePlayerBuffs.autoHealTurns -= 1;
          addLog(`【自動回復】HPが${autoHealAmount}回復した！ 残り${battlePlayerBuffs.autoHealTurns}ターン`);
        }

        let isOver = false;
        let nextTargetId = targetEnemy ? targetEnemy.id : newEnemies.find(e => e.hp > 0)?.id;

        const handleDefeat = () => {
          isOver = true;
          newPlayer.hp = Math.floor(stats.maxHp * 0.2);
          
          if (battle.isDefense) {
            newPlayer.underAttack = false;
            const lostTerritory = Math.min(newPlayer.territory, 2);
            newPlayer.territory -= lostTerritory;
            addLog(`【防衛失敗】領土を${lostTerritory}奪われてしまった...`);
            setTimeout(() => { 
              showToast(`防衛に失敗し、領土が${lostTerritory}減少しました`);
              setPlayer(newPlayer); persistSave(currentSlot, newPlayer); setGameState('main'); 
            }, 3000);
          } else if (battle.isInvasion) {
            addLog(`【侵略失敗】強大な敵国の返り討ちに遭った...`);
            setTimeout(() => { 
              showToast(`侵略に失敗しました`);
              setPlayer(newPlayer); persistSave(currentSlot, newPlayer); setGameState('main'); 
            }, 2500);
          } else {
            newPlayer.gold = Math.floor(newPlayer.gold / 2);
            addLog('あなたは倒れてしまった...');
            setTimeout(() => { 
              showToast('所持金が半分になり拠点に戻されました');
              setPlayer(newPlayer); persistSave(currentSlot, newPlayer); setGameState('main'); 
            }, 2000);
          }
        };

        if (fled) {
          if (battle.isDefense) {
            handleDefeat();
          } else {
            isOver = true;
            setTimeout(() => { 
              newPlayer = checkInvasion(newPlayer);
              setPlayer(newPlayer); persistSave(currentSlot, newPlayer); setGameState('main'); 
            }, 1500);
          }
        } else if (newPlayer.hp <= 0) {
          handleDefeat();
        } else if (newEnemies.every(e => e.hp <= 0 || e.escaped)) {
          let goldBonus = battle.isDefense ? 1.5 : battle.isInvasion ? 2.5 : 1.0;
          if (newPlayer.job === 'merchant') goldBonus *= 2.0;

          addLog(battle.isDefense ? `敵軍を撃退した！防衛成功！` : battle.isInvasion ? `敵国拠点を攻略！` : `敵を全滅させた！`);
          
          const baseTotalExp = newEnemies.reduce((sum, e) => sum + (e.escaped ? 0 : e.exp), 0);
          const expBoostActive = newPlayer.expBoostUntil && newPlayer.expBoostUntil > Date.now();
          const goldPotActive = newPlayer.inventory.some(i => i.id === 'i_gold_pot');
          const goldExpPassiveMultiplier = goldPotActive ? 1.5 : 1.0;
          const totalExp = Math.floor((expBoostActive ? baseTotalExp * 2 : baseTotalExp) * goldExpPassiveMultiplier);
          const totalGold = Math.floor(newEnemies.reduce((sum, e) => sum + (e.escaped ? 0 : e.gold), 0) * goldBonus * goldExpPassiveMultiplier);
          addLog(`${totalExp}の経験値と、${totalGold}Gを手に入れた！`);
          
          newPlayer.exp += totalExp;
          newPlayer.gold += totalGold;

          let droppedItems = [];
          newEnemies.filter(e => !e.escaped).forEach(e => {
             // 通常ドロップ：薬草40%、自己強化の薬20%（薬草の1/2）
             const dropRoll = randomInt(1, 100);
             if (dropRoll <= 5) {
                const drop = Object.assign({}, ENEMY_DROP_HERB);
                drop.uid = generateId();
                droppedItems.push(drop);
             } else if (dropRoll <= 60) {
                const drop = Object.assign({}, ENEMY_DROP_SELF_BUFF);
                drop.uid = generateId();
                droppedItems.push(drop);
             } else if (dropRoll <= 100) {
                let dropPool = [SHOP_ITEMS_MORNING[0], SHOP_ITEMS_MORNING[1], SHOP_ITEMS_MORNING[2]];
                if (e.level > 20) dropPool.push(SHOP_ITEMS_AFTERNOON[1]);
                if (e.level > 50) dropPool.push(NIGHT_MARKET_POOL[1]);
                const drop = Object.assign({}, dropPool[randomInt(0, dropPool.length - 1)]);
                drop.uid = generateId();
                droppedItems.push(drop);
             }
             // レアドロップ：金の壺 1%
             if (randomInt(1, 100) === 1) {
                const rareDrop = Object.assign({}, RARE_DROP_GOLD_POT);
                rareDrop.uid = generateId();
                droppedItems.push(rareDrop);
             }
          });
          if (droppedItems.length > 0) {
            droppedItems.forEach(d => {
              const existing = newPlayer.inventory.find(i => i.id === d.id && i.type === 'item');
              if (existing) {
                if (existing.amount < 99) {
                  existing.amount += 1;
                  addLog(`魔物が落とした ${d.name} を手に入れた！`);
                } else {
                  addLog(`魔物が落とした ${d.name} は持てないため捨てた`);
                }
              }
              else { d.amount = 1; newPlayer.inventory.push(d); addLog(`魔物が落とした ${d.name} を手に入れた！`); }
            });
          }
          
          if (battle.isDefense) {
            newPlayer.underAttack = false;
          } else if (battle.isInvasion) {
            newPlayer.territory += 3;
            newPlayer.nations[battle.targetNationId].isDestroyed = true;
            addLog(`【敵国滅亡】敵国の領地を奪い尽くし、滅亡させた！領土が3増加！`);
          } else {
            if (battle.direction === 'inside') {
              addLog(`【領土内巡回】魔物を討伐し、領土の安全を守った！`);
            } else {
              newPlayer.territory += 1; 
              if (battle.direction) {
                addLog(`【領土拡張】${EXPLORE_DIRECTIONS[battle.direction].name}の領地を開拓し、領土が1増加！`);
              } else {
                addLog(`【領土拡張】領地を開拓し、領土が1増加！`);
              }
            }
          }

          let leveledUp = false;

          while (newPlayer.exp >= calcReqExp(newPlayer.level) && newPlayer.level < MAX_LEVEL) {
            leveledUp = true;
            newPlayer.exp -= calcReqExp(newPlayer.level);
            newPlayer.level++;
            
            const isNeet = newPlayer.job === 'neet';
            const growthMult = isNeet ? 1.5 : 1.0;
            const spGain = isNeet ? 20 : 10;

            newPlayer.sp += spGain;
            
            newPlayer.baseStats.maxHp += Math.floor(randomInt(5, 10) * 4 * growthMult); 
            newPlayer.baseStats.maxMp += Math.floor(randomInt(1, 3) * 1.5 * growthMult); 
            newPlayer.baseStats.atk += Math.floor(randomInt(1, 3) * growthMult);
            newPlayer.baseStats.def += Math.floor(randomInt(1, 3) * growthMult);
            newPlayer.baseStats.mAtk += Math.floor(randomInt(1, 3) * growthMult);
            newPlayer.baseStats.mDef += Math.floor(randomInt(1, 3) * growthMult);
            newPlayer.baseStats.agi += Math.floor(randomInt(1, 3) * growthMult);
            newPlayer.baseStats.luk += Math.floor(randomInt(1, 2) * growthMult);
            
            addLog(`レベルが${newPlayer.level}に上がった！SPを${spGain}獲得！`);
          }

          if (leveledUp) {
            const newStats = getStats(newPlayer);
            newPlayer.hp = newStats.maxHp;
            newPlayer.mp = newStats.maxMp;
            addLog(`レベルアップ効果により、HPとMPが全回復した！`);
          }
          
          isOver = true;
          setTimeout(() => { 
            if (!battle.isDefense) newPlayer = checkInvasion(newPlayer);
            setPlayer(newPlayer); persistSave(currentSlot, newPlayer); setGameState('main'); 
          }, 3000);
        } else {
           if (!newEnemies.find(e => e.id === nextTargetId && e.hp > 0)) {
               nextTargetId = newEnemies.find(e => e.hp > 0)?.id;
           }
        }

        setPlayer(newPlayer);
        setBattle({ ...battle, enemies: newEnemies, logs, isOver, selectedTargetId: nextTargetId, playerBuffs: battlePlayerBuffs, turnCount: currentTurn });
      };

      const useItemInBattle = (item) => {
        if (item.id === 'i_self_buff_potion' && battle.playerBuffs?.atk > 0) {
          setBattle({ ...battle, logs: [...battle.logs, `【使用不可】${item.name}の効果はすでに発動中です！`] });
          setSelectedItem(null);
          return;
        }
        let newInventory = [...player.inventory];
        const itemIndex = newInventory.findIndex(i => i.uid === item.uid);
        if (itemIndex !== -1) {
          if (newInventory[itemIndex].amount > 1) {
            newInventory[itemIndex] = { ...newInventory[itemIndex], amount: newInventory[itemIndex].amount - 1 };
          } else {
            newInventory.splice(itemIndex, 1);
          }
        }
        
        let newPlayer = { ...player, inventory: newInventory };
        const stats = getStats(newPlayer);
        let logs = [...battle.logs];

        playSound('magic');
        if (item.healHp) {
          newPlayer.hp = Math.min(stats.maxHp, newPlayer.hp + item.healHp);
          logs.push(`【クイック使用】${item.name}を使った！ HPが回復した！`);

        if (item.healMp) {
          newPlayer.mp = Math.min(stats.maxMp, newPlayer.mp + item.healMp);
          logs.push(`【クイック使用】${item.name}を使った！ MPが回復した！`);
        }
        if (item.expBoostMinutes) {
          newPlayer.expBoostUntil = Date.now() + item.expBoostMinutes * 60 * 1000;
          logs.push(`【クイック使用】${item.name}を使った！ 30分間、獲得経験値が2倍になる！`);
        }
        if (item.id === 'i_self_buff_potion') {
          battle.playerBuffs = battle.playerBuffs ? { ...battle.playerBuffs } : { atk: 0, def: 0, agi: 0, stun: 0, autoHealTurns: 0, autoHealPercent: 0 };
          battle.playerBuffs.atk += 0.3;
          battle.playerBuffs.def += 0.3;
          battle.playerBuffs.agi += 0.3;
          logs.push(`【クイック使用】${item.name}を使った！ 攻撃・防御・速度が30%上昇した！`);
        }
        
        setPlayer(newPlayer);
        setBattle({ ...battle, logs });
        setSelectedItem(null);

      const useItemField = (item) => {
        const stats = getStats();
        let newHp = player.hp;
        let newMp = player.mp;
        let msg = "";

        if (item.healHp) {
          if (newHp >= stats.maxHp) return showToast('HPは満タンです');
          newHp = Math.min(stats.maxHp, newHp + item.healHp);
          msg += `HPが${item.healHp}回復 `;
        }
        if (item.healMp) {
          if (newMp >= stats.maxMp) return showToast('MPは満タンです');
          newMp = Math.min(stats.maxMp, newMp + item.healMp);
          msg += `MPが${item.healMp}回復`;
        }
        
        let newInventory = [...player.inventory];
        const itemIndex = newInventory.findIndex(i => i.uid === item.uid);
        if (itemIndex !== -1) {
          if (newInventory[itemIndex].amount > 1) {

          } else {

        }
        
        const newPlayer = { ...player, hp: newHp, mp: newMp, inventory: newInventory };
        if (item.expBoostMinutes) {

        setSelectedItem(null);

        if (player.sp < node.cost) return showToast('割り振りポイント(SP)が足りません');

        newPlayer.sp -= node.cost;

        if (node.type === 'skill') {

                      {enemy.hp > 0 && (
                        <div className="absolute -top-2 -right-6 flex flex-col gap-0.5">
                          {enemy.buffs?.atk > 0 && <span className="text-[10px] bg-red-800 text-white px-1 rounded font-bold">攻↑</span>}
                          {enemy.buffs?.def > 0 && <span className="text-[10px] bg-blue-800 text-white px-1 rounded font-bold">防↑</span>}
                          {enemy.buffs?.def < 0 && <span className="text-[10px] bg-gray-700 text-blue-300 px-1 rounded font-bold">防↓</span>}
                          {enemy.buffs?.agi < 0 && <span className="text-[10px] bg-gray-700 text-yellow-300 px-1 rounded font-bold">速↓</span>}
                          {enemy.buffs?.stun > 0 && <span className="text-[10px] bg-purple-600 text-white px-1 rounded font-bold">停止</span>}
                        </div>
                      )}
                    </div>
                    <div className="w-full text-center">
                      <div className={`font-bold ${enemy.baseName === RARE_ENEMY_STEEL_SLIME ? 'text-blue-300' : enemy.baseName === MID_BOSS_NAME ? 'text-purple-300' : 'text-red-300'} text-xs truncate`}>
                        {enemy.name} <span className="text-[10px] text-gray-400">Lv.{enemy.level}</span>
                      </div>
                      <div className="w-full bg-gray-900 rounded-full h-1.5 mt-1 relative">
                        <div className="bg-red-500 h-1.5 rounded-full transition-all" style={{width: `${Math.max(0, (enemy.hp/enemy.maxHp)*100)}%`}}></div>
                      </div>
                      <div className="text-[9px] text-red-200 mt-0.5">{enemy.hp} / {enemy.maxHp}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="h-40 bg-black border-y border-gray-800 p-2 overflow-y-auto text-xs space-y-1 font-mono leading-relaxed">
              {logs.map((log, idx) => {
                let color = 'text-gray-300';
                if (log.includes('倒した') || log.includes('手に入れた') || log.includes('捨てた') || log.includes('全滅') || log.includes('成功') || log.includes('拡張') || log.includes('巡回') || log.includes('クイック使用')) color = 'text-yellow-400';
                if (log.includes('ダメージを受けた') || log.includes('奪われてしまった') || log.includes('失敗')) color = 'text-red-400';
                if (log.includes('会心!')) color = 'text-orange-400 font-bold';
                if (log.includes('回復') || log.includes('援軍') || log.includes('効果発動') || log.includes('上昇')) color = 'text-green-400';
                if (log.includes('低下') || log.includes('止めた') || log.includes('行動不能')) color = 'text-purple-400';
                if (log.includes('HARD MODE')) color = 'text-red-500 font-bold';
                if (log.includes('VERY HARD MODE')) color = 'text-purple-400 font-bold';
                return <div key={idx} className={color}>{log}</div>;
              })}
              <div ref={logsEndRef} />
            </div>

            <div className="bg-gray-800 p-2 flex justify-between items-center text-sm border-b border-gray-700">
              <div className="flex items-center gap-2">
                <span className="text-xl">{player.avatar}</span>
                <span className="font-bold text-sm">{player.name}</span>
              </div>
              <div className="flex gap-3 text-xs items-center">
                <span className="text-green-400 font-bold flex items-center">
                  HP: {player.hp}/{stats.maxHp}
                  {playerBuffs?.atk > 0 && <span className="ml-1 text-[10px] bg-red-800 text-white px-1 rounded">攻↑</span>}
                  {playerBuffs?.def > 0 && <span className="ml-1 text-[10px] bg-blue-800 text-white px-1 rounded">防↑</span>}
                  {playerBuffs?.def < 0 && <span className="ml-1 text-[10px] bg-gray-700 text-blue-300 px-1 rounded">防↓</span>}
                  {playerBuffs?.agi < 0 && <span className="ml-1 text-[10px] bg-gray-700 text-yellow-300 px-1 rounded">速↓</span>}
                  {playerBuffs?.agi > 0 && <span className="ml-1 text-[10px] bg-green-800 text-white px-1 rounded">速↑</span>}
                </span>
                <span className="text-blue-400 font-bold">MP: {player.mp}/{stats.maxMp}</span>
              </div>
            </div>

            <div className="p-2 grid grid-cols-2 gap-2 bg-gray-900 pb-4">
              {!isOver && !selectedItem && (
                <>
                  <button onClick={() => processTurn('attack')} disabled={player.job === 'mage'} className="bg-gray-700 hover:bg-gray-600 disabled:opacity-30 disabled:cursor-not-allowed p-3 rounded-lg font-bold border border-gray-600 active:bg-gray-500 shadow-md">
                    たたかう{player.job === 'mage' ? '(不可)' : ''}

                  <button onClick={() => setSelectedItem('skill_select')} className="bg-gray-700 hover:bg-gray-600 p-3 rounded-lg font-bold border border-gray-600 active:bg-gray-500 shadow-md">スキル</button>
                  <button onClick={() => setSelectedItem('item_select')} className="bg-gray-700 hover:bg-gray-600 p-3 rounded-lg font-bold border border-gray-600 active:bg-gray-500 shadow-md">アイテム</button>
                  <button onClick={() => processTurn('flee')} className="bg-gray-700 hover:bg-gray-600 p-3 rounded-lg font-bold border border-gray-600 active:bg-gray-500 shadow-md">にげる</button>
                </>
              )}

              {!isOver && selectedItem === 'skill_select' && (
                <div className="col-span-2 bg-gray-800 p-2 rounded-lg border border-gray-700 space-y-2 max-h-48 overflow-y-auto shadow-inner">
                  <div className="flex justify-between items-center mb-1 px-1">
                    <span className="text-sm text-gray-400 font-bold">スキル選択</span>
                    <button onClick={() => setSelectedItem(null)} className="text-gray-400 bg-gray-700 p-1 rounded hover:bg-gray-600"><i className="fa-solid fa-xmark"></i></button>
                  </div>
                  {player.skills.length === 0 ? (
                    <div className="text-center text-sm text-gray-500 py-2">習得しているスキルがありません</div>
                  ) : (
                    player.skills.map(skillId => {
                      const s = SKILLS_DATA[skillId];
                      let canUse = false;
                      let showMp = s?.mpCost || 0;
                      if (player.job === 'mage') {
                        showMp = Math.ceil(showMp / 2);
                      }
                      canUse = player.mp >= showMp;

                      return (
                        <button key={skillId} disabled={!canUse} onClick={() => {setSelectedItem(null); processTurn('skill', s);}} 
                          className={`w-full text-left p-2 rounded flex flex-col justify-center ${canUse ? 'bg-gray-700 active:bg-gray-600 text-white' : 'bg-gray-800 text-gray-500'}`}>
                          <div className="flex justify-between w-full">
                            <span className="font-bold">{s?.name || skillId} {s?.target === 'all' && <span className="text-xs bg-red-900/50 text-red-300 px-1 rounded ml-1">全体</span>}</span>
                            <span className="text-blue-300 text-xs">MP {showMp}</span>

                          <span className="text-xs text-gray-400 mt-1">{s?.desc || ''}</span>

                    })
                  )}
                </div>
              )}

              {!isOver && selectedItem === 'item_select' && (
                <div className="col-span-2 bg-gray-800 p-2 rounded-lg border border-gray-700 space-y-2 max-h-48 overflow-y-auto shadow-inner">
                  <div className="flex justify-between items-center mb-1 px-1">
                    <span className="text-sm text-gray-400 font-bold">アイテム選択 (使用しても敵のターンには進みません)</span>
                    <button onClick={() => setSelectedItem(null)} className="text-gray-400 bg-gray-700 p-1 rounded hover:bg-gray-600"><i className="fa-solid fa-xmark"></i></button>
                  </div>

                    <div className="text-center text-sm text-gray-500 py-2">使えるアイテムがありません</div>
                  ) : (
                    player.inventory.filter(i => i.type === 'item').map(item => (
                      <button key={item.uid} onClick={() => useItemInBattle(item)} className="w-full text-left bg-gray-700 p-2 rounded flex justify-between items-center active:bg-gray-600 text-white">
                        <span>{item.name} <span className="text-xs text-gray-400">x{item.amount}</span></span>
                        <div className="text-xs text-right">
                          {item.healHp > 0 && <span className="text-green-300 ml-2">HP回復</span>}
                          {item.healMp > 0 && <span className="text-blue-300 ml-2">MP回復</span>}
                        </div>
                      </button>
                    ))
                  )}
                </div>
              )}
            </div>
          </div>
        );
      };

      const renderInventory = () => {
        const stats = getStats();
        return (
          <div className="flex flex-col h-full bg-gray-900 relative">
            <div className="bg-gray-800 p-4 flex items-center justify-between border-b border-gray-700 shadow-md z-10">
              <h2 className="text-xl font-bold flex items-center gap-2"><i className="fa-solid fa-suitcase"></i> 装備・道具</h2>
              <button onClick={() => {setGameState('main'); setSelectedItem(null);}} className="bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold">戻る</button>
            </div>

            <div className="p-4 bg-gray-800 border-b border-gray-700">
              <div className="grid grid-cols-4 gap-2 text-sm mb-4 text-center">
                <div className="bg-gray-700 p-2 rounded"><div className="text-gray-400 text-[10px]">攻撃(魔攻)</div><div className="font-bold">{stats.atk} <span className="text-purple-300 text-[10px]">({stats.mAtk})</span></div></div>

                <div className="bg-gray-700 p-2 rounded"><div className="text-gray-400 text-[10px]">速さ</div><div className="font-bold">{stats.agi}</div></div>
                <div className="bg-gray-700 p-2 rounded"><div className="text-gray-400 text-[10px]">運</div><div className="font-bold text-yellow-400">{stats.luk}</div></div>
              </div>
              <div className="space-y-2 text-sm">
                <div className="flex bg-gray-700/50 p-2 rounded items-center border border-gray-600">
                  <span className="w-12 text-gray-400">武器:</span> 
                  <span className="font-bold text-white flex items-center gap-1">
                    {player.equipment.weapon?.name ? `${player.equipment.weapon.name} +${player.equipment.weapon.upgradeLevel||0}` : 'なし'}
                    {player.equipment.weapon?.specialEffect && <span className="text-[9px] bg-purple-600 px-1 rounded shadow">特</span>}
                  </span>
                </div>
                <div className="flex bg-gray-700/50 p-2 rounded items-center border border-gray-600">
                  <span className="w-12 text-gray-400">防具:</span> 
                  <span className="font-bold text-white flex items-center gap-1">
                    {player.equipment.armor?.name ? `${player.equipment.armor.name} +${player.equipment.armor.upgradeLevel||0}` : 'なし'}
                    {player.equipment.armor?.specialEffect && <span className="text-[9px] bg-purple-600 px-1 rounded shadow">特</span>}
                  </span>
                </div>
                <div className="flex bg-gray-700/50 p-2 rounded items-center border border-gray-600">
                  <span className="w-12 text-gray-400">靴:</span> 
                  <span className="font-bold text-white flex items-center gap-1">
                    {player.equipment.shoes?.name ? `${player.equipment.shoes.name} +${player.equipment.shoes.upgradeLevel||0}` : 'なし'}
                    {player.equipment.shoes?.specialEffect && <span className="text-[9px] bg-purple-600 px-1 rounded shadow">特</span>}
                  </span>
                </div>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-2 pb-6">
              {player.inventory.map(item => {
                const isEquipped = Object.values(player.equipment).some(eq => eq?.uid === item.uid);
                const isSelected = selectedItem?.uid === item.uid;
                let Icon = <i className="fa-solid fa-circle text-gray-400"></i>;
                if(item.type === 'weapon') Icon = <i className="fa-solid fa-khanda text-red-400"></i>;
                if(item.type === 'armor') Icon = <i className="fa-solid fa-shield text-blue-400"></i>;
                if(item.type === 'shoes') Icon = <i className="fa-solid fa-bolt text-yellow-400"></i>;
                if(item.type === 'item') Icon = <i className="fa-solid fa-heart text-green-400"></i>;

                return (
                  <div key={item.uid} onClick={() => setSelectedItem(isSelected ? null : item)}
                    className={`bg-gray-800 border p-3 rounded-lg transition-all ${isSelected ? 'border-blue-500 bg-gray-700 shadow-md' : 'border-gray-700'}`}>
                    <div className="flex justify-between items-center">
                      <div className="font-bold flex items-center gap-1 text-sm text-white">
                        {Icon} {item.name} 
                        {item.upgradeLevel > 0 && <span className="text-orange-400 text-xs">+{item.upgradeLevel}</span>} 
                        {item.specialEffect && <span className="text-[9px] bg-purple-600/80 px-1 py-0.5 rounded shadow">特</span>}
                        {item.amount && <span className="text-gray-400 text-sm ml-1">x{item.amount}</span>}
                      </div>
                      {isEquipped && <span className="text-[10px] bg-blue-600/80 px-1.5 py-0.5 rounded text-white font-bold border border-blue-500">装備中</span>}
                    </div>
                    {isSelected && (
                      <div className="mt-3 pt-3 border-t border-gray-600 animate-fade-in">
                        <p className="text-sm text-gray-300 mb-3">{item.desc}</p>

                          <button onClick={(e) => { e.stopPropagation(); useItemField(item); }} className="w-full bg-green-600 hover:bg-green-500 p-3 rounded-lg font-bold text-sm shadow">使う</button>

                          <button onClick={(e) => { e.stopPropagation(); equipItem(item); }} disabled={isEquipped} className="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 p-3 rounded-lg font-bold text-sm shadow">
                            {isEquipped ? '装備済み' : '装備する'}
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                )
              })}
            </div>
          </div>
        );
      };

      const renderSkillTree = () => {
        const fullTree = getFullSkillTree(player);
        const skillNodes = fullTree.filter(node => node.type === 'skill');
        const statNodes = fullTree.filter(node => node.type !== 'skill');
        const renderNode = (node) => {
          const isUnlocked = player.unlockedNodes.includes(node.id);
          if (isUnlocked) return null;
          const meetLevel = player.level >= (node.minLevel || 1);
          const meetReq = node.req.every(reqId => player.unlockedNodes.includes(reqId));
          const canUnlock = meetLevel && meetReq;
          const isPersonal = player.personalSkillTree?.some(p => p.id === node.id);

          let bgClass = 'bg-gray-800 border-gray-700 opacity-50';
          if (isPersonal) bgClass = 'bg-indigo-950/60 border-indigo-700/50 opacity-60';
          if (canUnlock) {
            bgClass = isPersonal ? 'bg-indigo-800 border-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.4)]' : 'bg-gray-700 border-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.3)]';
          }

          const isSelected = selectedSkillNode?.id === node.id;

          return (
            <div key={node.id} onClick={() => setSelectedSkillNode(isSelected ? null : node)} className={`p-4 rounded-xl border-2 transition-all cursor-pointer ${bgClass}`}>
              <div className="flex justify-between items-start mb-2">
                <div>
                  <h3 className={`font-bold flex items-center gap-2 ${isPersonal ? 'text-yellow-300' : 'text-white'}`}>
                    {node.name}
                  </h3>
                  <p className="text-sm text-gray-300 mt-1">{node.desc}</p>
                </div>
                <div className="text-blue-300 font-bold bg-blue-900/40 px-2 py-1 rounded text-xs border border-blue-800">{node.cost} SP</div>
              </div>

                <div className="mt-3 pt-3 border-t border-gray-600 animate-fade-in">
                  <div className="text-xs text-red-400 mb-3 font-bold flex flex-col gap-1 bg-black/40 p-2 rounded">
                    {!meetLevel && <div><i className="fa-solid fa-lock mr-1"></i>必要Lv. {node.minLevel} (現在Lv.{player.level})</div>}
                    {!meetReq && <div><i className="fa-solid fa-lock mr-1"></i>前提スキルが未習得です</div>}
                    {meetLevel && meetReq && <div className="text-green-400"><i className="fa-solid fa-unlock mr-1"></i>解放条件を満たしています</div>}
                  </div>
                  {canUnlock && (
                    <button onClick={(e) => { e.stopPropagation(); unlockSkill(node); }} className={`w-full text-white p-3 rounded-lg font-bold text-sm shadow ${isPersonal ? 'bg-indigo-600 hover:bg-indigo-500' : 'bg-blue-600 hover:bg-blue-500'}`}>
                      SPを消費して解放する
                    </button>
                  )}
                </div>
              )}
            </div>
          );
        };

          <div className="flex flex-col h-full bg-gray-900 relative">

              <button onClick={() => setGameState('main')} className="bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold">戻る</button>
            </div>
            <div className="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center sticky top-0 z-10 shadow-sm">
              <span className="text-gray-300 font-bold">残りSP</span>
              <span className="text-2xl font-bold text-blue-400">{player.sp}</span>
            </div>
            <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-10">
              <div className="text-xs text-yellow-400 font-bold mb-2 pt-2 border-b border-yellow-900/50 pb-1">
                <i className="fa-solid fa-star"></i> このキャラクターの固有能力

                <div className="space-y-3">
                  <button onClick={() => setSkillSectionOpen(!skillSectionOpen)} className="w-full flex justify-between items-center text-sm text-blue-300 font-bold border-b border-blue-900/50 pb-1">
                     <span><i className="fa-solid fa-bolt mr-1"></i>スキル</span><i className={`fa-solid ${skillSectionOpen ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                   </button>
                   {skillSectionOpen && skillNodes.map(renderNode)}
                </div>
              )}

              {statNodes.filter(node => !player.unlockedNodes.includes(node.id)).length > 0 && (
                <div className="space-y-3">
                  <button onClick={() => setStatSectionOpen(!statSectionOpen)} className="w-full flex justify-between items-center text-sm text-green-300 font-bold border-b border-green-900/50 pb-1">
                     <span><i className="fa-solid fa-chart-line mr-1"></i>能力強化</span><i className={`fa-solid ${statSectionOpen ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                   </button>
                   {statSectionOpen && statNodes.map(renderNode)}
                </div>
              )}
            </div>
          </div>
        );

        const hour = new Date().getHours();
        const shopItems = getCurrentShopItems();
        const isMorning = hour < 12;

        return (
          <div className="flex flex-col h-full bg-gray-900 relative">
            <div className="bg-gray-800 p-4 flex items-center justify-between border-b border-gray-700 shadow-md z-10">
              <h2 className="text-xl font-bold flex items-center gap-2"><i className="fa-solid fa-store text-green-400"></i> 商人</h2>
              <button onClick={() => setGameState('main')} className="bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold">戻る</button>
            </div>
            
            <div className="p-3 bg-gray-800 border-b border-gray-700 flex justify-between items-center sticky top-0 z-10 text-xs">
              <div>営業時間: <span className="text-green-400 font-bold">7:00 ~ 23:59</span></div>
              <div>商品更新: <span className="text-yellow-400 font-bold">{isMorning ? '午前の品揃え (12時に変更)' : '午後の品揃え (0時に変更)'}</span></div>
            </div>

            <div className="p-3 bg-gray-800 border-b border-gray-700 space-y-3">
              <div className="flex justify-between items-center">
                <span className="text-gray-300 font-bold text-sm">所持金</span>
                <span className="text-xl font-bold text-yellow-400"><i className="fa-solid fa-coins mr-1"></i>{player.gold} G</span>
              </div>
              
              <div className="grid grid-cols-2 gap-2 bg-gray-900 p-1 rounded-lg border border-gray-700">
                <button 
                  onClick={() => setShopTab('buy')} 
                  className={`py-2 text-xs font-bold rounded-md transition-all ${shopTab === 'buy' ? 'bg-green-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-cart-shopping mr-1"></i> 買い出し (購入)
                </button>
                <button 
                  onClick={() => setShopTab('sell')} 
                  className={`py-2 text-xs font-bold rounded-md transition-all ${shopTab === 'sell' ? 'bg-amber-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-sack-dollar mr-1"></i> 買取 (売却)
