<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Territory RPG - メンテナンス中</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #0b0d14;
      color: #e2e8f0;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(126, 34, 206, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(30, 27, 75, 0.3) 0%, transparent 60%);
    }

    .font-title {
      font-family: 'Cinzel', serif;
    }

    /* Minimal Soft Glow Effects */
    .glow-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5),
                  0 0 30px 2px rgba(147, 51, 234, 0.08);
    }

    @keyframes subtle-pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    .pulse-dot {
      animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b0d14; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4 sm:p-6 selection:bg-purple-900 selection:text-purple-200">

  <!-- Top Brand Header -->
  <header class="w-full max-w-xl text-center pt-6 pb-2">
    <div class="inline-flex items-center space-x-3 mb-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-600 to-indigo-900 flex items-center justify-center shadow-lg border border-purple-400/30">
        <span class="text-xl">🏰</span>
      </div>
      <h1 class="font-title text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-purple-200 to-amber-300">
        Territory RPG
      </h1>
    </div>
  </header>

  <!-- Main Centered Content Card -->
  <main class="w-full max-w-xl my-auto">
    <div class="glow-card rounded-2xl p-6 sm:p-8 space-y-6 text-center relative overflow-hidden">
      
      <!-- Status Badge -->
      <div class="inline-flex items-center space-x-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1 rounded-full text-xs font-medium">
        <span class="relative flex h-2 w-2">
          <span class="pulse-dot absolute inline-flex h-full w-full rounded-full bg-amber-400"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
        </span>
        <i class="fa-solid fa-wrench text-[11px]"></i>
        <span>メンテナンス実施中</span>
      </div>

      <!-- Heading & Explanation -->
      <div class="space-y-3">
        <h2 class="text-xl sm:text-2xl font-bold text-slate-100">
          不具合修正に伴うメンテナンス中
        </h2>
        <p class="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-md mx-auto">
          いつも『Territory RPG』をご利用いただきありがとうございます。<br>
          現在、不具合の修正およびシステム調整作業のため、メンテナンスを実施しております。
        </p>
      </div>

      <!-- Countdown & Completion Time -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4 space-y-3">
        <div class="text-xs text-slate-400 font-medium">
          再開予定時期：<span class="text-amber-300 font-bold">9/20 20:00 頃</span>
        </div>

        <!-- Countdown Display -->
        <div class="grid grid-cols-3 gap-2 max-w-xs mx-auto pt-1">
          <div class="bg-slate-950/80 border border-slate-800 rounded-lg p-2">
            <span id="cd-hours" class="block text-xl sm:text-2xl font-bold font-mono text-purple-300">00</span>
            <span class="text-[9px] text-slate-500 uppercase tracking-wider">Hours</span>
          </div>
          <div class="bg-slate-950/80 border border-slate-800 rounded-lg p-2">
            <span id="cd-minutes" class="block text-xl sm:text-2xl font-bold font-mono text-purple-300">00</span>
            <span class="text-[9px] text-slate-500 uppercase tracking-wider">Mins</span>
          </div>
          <div class="bg-slate-950/80 border border-slate-800 rounded-lg p-2">
            <span id="cd-seconds" class="block text-xl sm:text-2xl font-bold font-mono text-purple-300">00</span>
            <span class="text-[9px] text-slate-500 uppercase tracking-wider">Secs</span>
          </div>
        </div>
      </div>

      <!-- Refresh Status Button -->
      <button id="btn-check-status" onclick="checkServerStatus()" class="w-full py-3 px-4 bg-purple-900/40 hover:bg-purple-800/50 active:bg-purple-950 text-purple-200 text-xs font-semibold rounded-xl border border-purple-500/30 transition flex items-center justify-center space-x-2">
        <i id="check-icon" class="fa-solid fa-rotate-right"></i>
        <span>接続状態の確認</span>
      </button>

    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-4 text-[11px] text-slate-500 space-y-1">
    <p>© Territory RPG Development Team</p>
  </footer>

  <!-- Notification Toast Container -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
    <div class="bg-slate-900 border border-purple-500/50 text-slate-200 px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2 text-xs">
      <i id="toast-icon" class="fa-solid fa-clock text-amber-400"></i>
      <span id="toast-message">作業を進行中です。しばらくお待ちください。</span>
    </div>
  </div>

  <script>
    // Countdown Timer Target: 9/20 20:00
    function getTargetTime() {
      const target = new Date();
      target.setFullYear(2026, 8, 20); // September 20th (Month is 0-indexed)
      target.setHours(20, 0, 0, 0);
      return target;
    }

    const targetDate = getTargetTime();

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('cd-hours').innerText = '00';
        document.getElementById('cd-minutes').innerText = '00';
        document.getElementById('cd-seconds').innerText = '00';
        return;
      }

      const hours = Math.floor(diff / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cd-hours').innerText = String(hours).padStart(2, '0');
      document.getElementById('cd-minutes').innerText = String(minutes).padStart(2, '0');
      document.getElementById('cd-seconds').innerText = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // Refresh Server Status Simulation
    function checkServerStatus() {
      const icon = document.getElementById('check-icon');
      const btn = document.getElementById('btn-check-status');

      icon.classList.add('fa-spin');
      btn.disabled = true;

      setTimeout(() => {
        icon.classList.remove('fa-spin');
        btn.disabled = false;
        showToast('現在メンテナンス作業中です。再開までしばらくお待ちください。');
      }, 1000);
    }

    // Toast Notification System
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');

      toastMsg.innerText = msg;

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>
</body>
</html>
