<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TERRITORY RPG セーブ保護・復旧</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f5;color:#222}
main{max-width:900px;margin:auto;padding:20px;background:#fff;min-height:100vh}
h1{font-size:24px}
button{display:block;width:100%;padding:15px;margin:12px 0;font-size:17px;border:0;border-radius:10px;background:#222;color:#fff}
button.secondary{background:#555}
button.danger{background:#8b1e1e}
.notice{padding:14px;border-radius:10px;background:#fff3cd;margin:15px 0}
.ok{padding:14px;border-radius:10px;background:#e8f5e9;margin:15px 0}
pre{white-space:pre-wrap;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:8px}
.small{font-size:13px;color:#555}
</style>
</head>
<body>
<main>
<h1>🛡️ TERRITORY RPG セーブ保護・復旧</h1>

<div class="notice">
<b>最初に「① 現在のセーブを完全バックアップ」を押してください。</b><br>
このボタンは現在の保存データを読み取って、バックアップJSONを作成するだけです。
ゲームセーブ自体は変更しません。
</div>

<button id="backup">① 現在のセーブを完全バックアップ</button>
<button id="deep" class="secondary">② 追加保存領域を調査する</button>

<div id="result"></div>

<hr>

<h2>③ 残っているセーブを復旧</h2>
<p>
現在確認されているV14/V15セーブを、同じキーへ書き戻すための機能です。
<strong>バックアップを作成してから</strong>使用してください。
</p>

<select id="saveSelect" style="width:100%;padding:12px;font-size:16px"></select>
<button id="restore">選択したセーブを復旧する</button>

<p class="small">
※ このページは、①を実行するまでは保存領域へ書き込みません。<br>
※ ②も読み取り専用です。<br>
※ ③だけが選択したセーブキーを書き戻します。既存データを削除する処理はありません。
</p>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const result = $('result');
  const select = $('saveSelect');
  let saves = [];

  const isSaveKey = key =>
    /^territory_rpg_v\d+_save_slot_\d+(?:_backup)?$/i.test(key) ||
    /^rpg_save_/i.test(key);

  const parse = (key, value) => {
    try {
      const obj = JSON.parse(value);
      if (obj && typeof obj === 'object') return obj;
    } catch(e) {}
    return null;
  };

  const collect = () => {
    const found = [];
    const seen = new Set();

    // localStorage: read only
    try {
      for (let i=0;i<localStorage.length;i++) {
        const key = localStorage.key(i);
        if (!key || !isSaveKey(key) || seen.has('ls:'+key)) continue;
        seen.add('ls:'+key);
        const value = localStorage.getItem(key);
        if (value != null) found.push({source:'localStorage',key,value,obj:parse(key,value)});
      }
    } catch(e) {
      found.push({source:'error',key:'localStorage',value:String(e),obj:null});
    }

    // cookies: read only
    try {
      const parts = document.cookie ? document.cookie.split('; ') : [];
      for (const part of parts) {
        const p = part.indexOf('=');
        if (p < 0) continue;
        const key = decodeURIComponent(part.slice(0,p));
        if (!isSaveKey(key)) continue;
        let value = '';
        try { value = decodeURIComponent(part.slice(p+1)); } catch(e) { value = part.slice(p+1); }
        found.push({source:'cookie',key,value,obj:parse(key,value)});
      }
    } catch(e) {}

    return found;
  };

  const populate = () => {
    select.innerHTML = '';
    saves = collect().filter(x => x.obj && x.source === 'localStorage' && !/_backup$/i.test(x.key));
    if (!saves.length) {
      select.innerHTML = '<option value="">復旧可能なセーブが見つかりません</option>';
      return;
    }
    saves.forEach((s,i) => {
      const o=s.obj;
      const text = `${s.key} | 名前=${o.name ?? '-'} | Lv=${o.level ?? '-'} | G=${o.gold ?? '-'} | EXP=${o.exp ?? '-'} | lastSave=${o.lastSave ?? '-'}`;
      const op=document.createElement('option');
      op.value=String(i); op.textContent=text; select.appendChild(op);
    });
  };

  $('backup').onclick = () => {
    const found = collect();
    const payload = {
      exportedAt: new Date().toISOString(),
      purpose: 'TERRITORY RPG save backup',
      warning: 'This file is a read-only snapshot. No save data was deleted by this tool.',
      entries: found.map(x => ({
        source:x.source,key:x.key,value:x.value,parsed:x.obj
      }))
    };

    // Create a recovery snapshot under a NEW key; existing saves are untouched.
    try {
      const snapshotKey = `territory_rpg_recovery_snapshot_${Date.now()}`;
      localStorage.setItem(snapshotKey, JSON.stringify(payload));
      payload.snapshotKey = snapshotKey;
    } catch(e) {
      payload.snapshotWriteError = String(e);
    }

    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url;
    a.download='territory_rpg_save_backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

    const valid = found.filter(x=>x.obj);
    result.innerHTML = `<div class="ok"><b>バックアップ完了</b><br>
      調査対象 ${found.length} 件 / JSONセーブ ${valid.length} 件<br>
      新しい保護用スナップショットも作成しました。<br>
      ダウンロードされた <code>territory_rpg_save_backup.json</code> は大切に保管してください。</div>`;
    populate();
  };

  $('deep').onclick = async () => {
    const info = [];
    info.push(`localStorage件数: ${localStorage.length}`);
    info.push(`Cookie件数: ${document.cookie ? document.cookie.split('; ').length : 0}`);

    // IndexedDB database names, if supported. Read-only enumeration.
    try {
      if (indexedDB.databases) {
        const dbs = await indexedDB.databases();
        info.push(`IndexedDBデータベース: ${dbs.length}件`);
        dbs.forEach(db => info.push(`  - ${db.name || '(名称なし)'}`));
      } else {
        info.push('IndexedDB: databases() 非対応');
      }
    } catch(e) {
      info.push(`IndexedDB調査エラー: ${e}`);
    }

    // Cache Storage names, if supported. Read-only enumeration.
    try {
      if (window.caches && caches.keys) {
        const names = await caches.keys();
        info.push(`Cache Storage: ${names.length}件`);
        names.forEach(n => info.push(`  - ${n}`));
      }
    } catch(e) {
      info.push(`Cache Storage調査エラー: ${e}`);
    }

    result.innerHTML = `<div class="ok"><b>追加調査結果</b><pre>${info.join('\\n')}</pre>
      <p>この調査ではIndexedDB/Cache Storageの中身は変更していません。</p></div>`;
  };

  $('restore').onclick = () => {
    const idx = Number(select.value);
    const item = saves[idx];
    if (!item) {
      alert('復旧可能なセーブがありません。');
      return;
    }
    if (!confirm(
      `このセーブを復旧しますか？\\n\\n${item.key}\\n名前=${item.obj.name ?? '-'}\\nLv=${item.obj.level ?? '-'}\\nG=${item.obj.gold ?? '-'}\\nEXP=${item.obj.exp ?? '-'}\\nlastSave=${item.obj.lastSave ?? '-'}\\n\\n既存の同じキーをこのデータで上書きします。`
    )) return;

    try {
      localStorage.setItem(item.key, item.value);
      alert('復旧しました。ゲーム本体を再読み込みしてください。');
    } catch(e) {
      alert('復旧に失敗しました: '+e);
    }
  };

  populate();
})();
</script>
</body>
</html>
